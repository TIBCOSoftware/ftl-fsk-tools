# KOF Cluster Configuration
# Generated by tibkafkatokof from: examples/16-3broker-sasl+oauth2/server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver -c kof-cluster.yaml -n SRV1
#   tibftlserver -c kof-cluster.yaml -n SRV2
#   tibftlserver -c kof-cluster.yaml -n SRV3

globals:
  core.servers:
    SRV1: kafka-sasl-oauth-1:5695
    SRV2: kafka-sasl-oauth-2:5696
    SRV3: kafka-sasl-oauth-3:5697

servers:
  SRV1:
  - realm: {}
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: examples/16-3broker-sasl+oauth2/output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - persistence:
      name: pserver2
      data: /var/kof/data/pserver2
      kof.broker.properties: examples/16-3broker-sasl+oauth2/output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - persistence:
      name: pserver3
      data: /var/kof/data/pserver3
      kof.broker.properties: examples/16-3broker-sasl+oauth2/output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
    initial.realm.config: examples/16-3broker-sasl+oauth2/output/realm.json
