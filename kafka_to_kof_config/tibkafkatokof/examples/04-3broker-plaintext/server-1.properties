############################# Server Basics #############################

# KRaft mode: this node acts as both broker and controller.
process.roles=broker,controller

# Unique numeric ID for this node within the cluster.
node.id=1

# Bootstrap addresses for the KRaft controller quorum.
controller.quorum.bootstrap.servers=localhost:9093,localhost:9103,localhost:9113

############################# Socket Server Settings #############################

# Bind addresses for broker (CLIENT:9092) and controller (CONTROLLER:9093).
# Use a distinct CLIENT name (not PLAINTEXT) so tibkafkatokof preserves the
# client listener in kof.broker.properties. In KoF, inter-broker replication
# is FTL-native; there is no Kafka-level inter-broker listener to strip.
listeners=CLIENT://localhost:9092,CONTROLLER://localhost:9093

# Addresses advertised to Kafka clients.
advertised.listeners=CLIENT://localhost:9092

# Listeners used by the KRaft controller.
controller.listener.names=CONTROLLER

# Map each listener name to its security protocol.
listener.security.protocol.map=CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT

# Threads for network I/O.
num.network.threads=3

# Threads for request processing (may include disk I/O).
num.io.threads=8

# Socket send/receive buffer sizes.
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400

# Maximum request size (OOM protection).
socket.request.max.bytes=104857600

############################# Log Basics #############################

# Directory where this broker stores its log segments.
log.dirs=/var/kafka/data/broker-1

# Default number of partitions per topic.
num.partitions=3

# Recovery threads per data directory.
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

# Replication factors for internal Kafka topics.
# Use 3 for any production cluster with 3+ brokers.
offsets.topic.replication.factor=3
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

############################# Log Flush Policy #############################

# Force a flush after this many messages (uncomment to enable).
#log.flush.interval.messages=10000

# Force a flush after this many milliseconds (uncomment to enable).
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

# Minimum age (hours) before a log segment can be deleted.
log.retention.hours=168

# Maximum size (bytes) of a log segment file.
log.segment.bytes=1073741824

# How often to check whether log segments are eligible for deletion.
log.retention.check.interval.ms=300000
