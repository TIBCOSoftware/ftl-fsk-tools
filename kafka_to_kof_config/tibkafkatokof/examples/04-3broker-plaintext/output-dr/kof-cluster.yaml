# KOF Cluster Configuration
# Generated by tibkafkatokof from: server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster.yaml --server SRV1
#   tibftlserver --yaml kof-cluster.yaml --server SRV2
#   tibftlserver --yaml kof-cluster.yaml --server SRV3

globals:
  core.servers:
    SRV1: kafka-broker-1:5689
    SRV2: kafka-broker-1:5678
    SRV3: kafka-broker-1:5624
  dr: DRSRV1@dr-host-1:5800|DRSRV2@dr-host-2:5801|DRSRV3@dr-host-3:5802
  auto.init.primary.on.first.startup: true

servers:
  SRV1:
  - realm:
      label: PRIMARY_SERVER
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: output-dr/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm:
      label: PRIMARY_SERVER
  - persistence:
      name: pserver2
      data: /var/kof/data/pserver2
      kof.broker.properties: output-dr/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm:
      label: PRIMARY_SERVER
  - persistence:
      name: pserver3
      data: /var/kof/data/pserver3
      kof.broker.properties: output-dr/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
