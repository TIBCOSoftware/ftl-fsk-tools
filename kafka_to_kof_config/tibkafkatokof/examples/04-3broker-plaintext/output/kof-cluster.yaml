# KOF Cluster Configuration
# Generated by tibkafkatokof from: examples/04-3broker-plaintext/server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver -c kof-cluster.yaml -n SRV1
#   tibftlserver -c kof-cluster.yaml -n SRV2
#   tibftlserver -c kof-cluster.yaml -n SRV3

globals:
  core.servers:
    SRV1: localhost:5600
    SRV2: localhost:5601
    SRV3: localhost:5602

servers:
  SRV1:
  - realm: {}
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: examples/04-3broker-plaintext/output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - persistence:
      name: pserver2
      data: /var/tmp/kof/data/pserver2
      kof.broker.properties: examples/04-3broker-plaintext/output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - persistence:
      name: pserver3
      data: /var/tmp/kof/data/pserver3
      kof.broker.properties: examples/04-3broker-plaintext/output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/tmp/kof/data
  realm:
    data: /var/tmp/kof/data
    initial.realm.config: examples/04-3broker-plaintext/output/realm.json
