# kafka-to-kof.properties — generated by tibkafkatokof
# Replace each <KOF-HOST-N> with the actual hostname of the corresponding KOF pserver.
# Run in the kafka_to_kof_migration directory:
#   KAFKA_CLASSPATH=... ./run-kafka-to-kof.sh --config <this-file> --dry-run
#   KAFKA_CLASSPATH=... ./run-kafka-to-kof.sh --config <this-file>

source.bootstrap.servers=kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092
target.bootstrap.servers=<KOF-HOST-1>:9092,<KOF-HOST-2>:9092,<KOF-HOST-3>:9092

# Topic selection
topic.pattern=.*
include.internal=false

# Target topic settings
target.replication.factor=1

# Runtime settings
client.id=kafka-to-kof-replicator
request.timeout.ms=60000
max.empty.polls=15
dry.run=false

# Records per batch per partition before flushing to KOF
batch.size=1000

# Optional pass-through security (uncomment and fill in as needed)
# source.admin.security.protocol=SASL_SSL
# source.admin.sasl.mechanism=PLAIN
# source.admin.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="user" password="pass";
