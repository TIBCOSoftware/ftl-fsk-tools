# KOF Cluster Configuration
# Generated by tibkafkatokof from: server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster.yaml --server SRV1

globals:
  core.servers:
    SRV1: kafka-single-1:5663
  auth.providers: file:output/ftl-users.txt

servers:
  SRV1:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
    initial.realm.config: output/realm.json
