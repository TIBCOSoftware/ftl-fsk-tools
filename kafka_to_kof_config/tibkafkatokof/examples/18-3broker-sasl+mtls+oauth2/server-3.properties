############################# Server Basics #############################
#
# KRaft mode: broker + controller. Three client-facing listeners:
#   SASL_AUTH — SASL_SSL PLAIN  (username/password + TLS, for legacy clients)
#   MTLS      — SSL with ssl.client.auth=required  (mutual TLS clients)
#   OAUTH     — SASL_SSL OAUTHBEARER  (OAuth 2.0 bearer token clients)
# KOF auth providers: file:/etc/ftl/users.txt,mtls,oauth2

process.roles=broker,controller
node.id=3
controller.quorum.bootstrap.servers=kafka-s-m-o-1:9093,kafka-s-m-o-2:9093,kafka-s-m-o-3:9093

############################# Socket Server Settings #############################

listeners=SASL_AUTH://0.0.0.0:9092,MTLS://0.0.0.0:9094,OAUTH://0.0.0.0:9095,CONTROLLER://0.0.0.0:9093
inter.broker.listener.name=SASL_AUTH
advertised.listeners=SASL_AUTH://kafka-s-m-o-3:9092,MTLS://kafka-s-m-o-3:9094,OAUTH://kafka-s-m-o-3:9095,CONTROLLER://kafka-s-m-o-3:9093
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:SSL,SASL_AUTH:SASL_SSL,MTLS:SSL,OAUTH:SASL_SSL
num.network.threads=4
num.io.threads=10
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# TLS / SSL Settings #############################

ssl.keystore.type=JKS
ssl.keystore.location=/etc/kafka/certs/kafka-s-m-o-3.keystore.jks
ssl.keystore.password=keystorePassword123
ssl.key.password=keyPassword123
ssl.truststore.type=JKS
ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
ssl.truststore.password=truststorePassword123
ssl.protocol=TLSv1.3
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.endpoint.identification.algorithm=https

############################# SASL_AUTH Listener — SASL_SSL PLAIN #############################

listener.name.sasl_auth.sasl.enabled.mechanisms=PLAIN
listener.name.sasl_auth.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_producer="producer-secret" user_consumer="consumer-secret";
sasl.mechanism.inter.broker.protocol=PLAIN

############################# MTLS Listener — SSL with mandatory client certificate #############################

listener.name.mtls.ssl.client.auth=required
listener.name.mtls.ssl.truststore.location=/etc/kafka/certs/kafka-client-ca.truststore.jks
listener.name.mtls.ssl.truststore.password=truststorePassword123

############################# OAUTH Listener — SASL_SSL OAUTHBEARER #############################

listener.name.oauth.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.oauth.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.token.endpoint.uri="https://auth.example.com/oauth/token" oauth.client.id="kafka-s-m-o-3" oauth.client.secret="broker-client-secret";
listener.name.oauth.oauthbearer.sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
listener.name.oauth.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
listener.name.oauth.oauthbearer.connections.max.reauth.ms=3600000

############################# CONTROLLER Listener — SSL only (internal) #############################

listener.name.controller.ssl.keystore.location=/etc/kafka/certs/kafka-s-m-o-3.keystore.jks
listener.name.controller.ssl.keystore.password=keystorePassword123
listener.name.controller.ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
listener.name.controller.ssl.truststore.password=truststorePassword123

############################# Log Basics #############################

log.dirs=/var/kafka/s-m-o/broker-3
num.partitions=3
num.recovery.threads.per.data.dir=1

offsets.topic.replication.factor=3
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
