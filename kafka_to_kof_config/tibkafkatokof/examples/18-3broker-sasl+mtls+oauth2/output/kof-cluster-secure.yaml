# KOF Cluster — Secure Configuration
# Generated by tibkafkatokof from: examples/18-3broker-sasl+mtls+oauth2/server-1.properties
#
# Auth providers: file:/etc/ftl/users.txt,mtls,oauth2
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver -c kof-cluster-secure.yaml -n SRV1
#   tibftlserver -c kof-cluster-secure.yaml -n SRV2
#   tibftlserver -c kof-cluster-secure.yaml -n SRV3

globals:
  core.servers:
    SRV1: kafka-s-m-o-1:5710
    SRV2: kafka-s-m-o-2:5711
    SRV3: kafka-s-m-o-3:5712
  auth.providers: file:/etc/ftl/users.txt,mtls,oauth2
  oauth2.claim.roles: group
  oauth2.claim.username: preferred_username
  oauth2.audience: ftl
  oauth2.ui.endpoint.auth: https://auth.example.com/oauth/authorize
  oauth2.ui.endpoint.token: https://auth.example.com/oauth/token
  oauth2.ui.endpoint.logout: https://auth.example.com/oauth/logout
  oauth2.svr.endpoint.token: https://auth.example.com/oauth/token

servers:
  SRV1:
  - realm: {}
  - ftlserver.properties:
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/client.pem
      tls.client.private.key: /etc/ftl/certs/client.key
      oauth2.validation.key: file:/etc/ftl/oauth.json
      oauth2.ui.client.id: ftl-ui
      oauth2.ui.client.secret: env:OAUTH_UI_CLIENT_SECRET
      oauth2.provider.trust.file: /etc/ftl/certs/oauth-provider.pem
      oauth2.svr.client.id: ftl-server
      oauth2.svr.client.secret: env:OAUTH_CLIENT_SECRET
      auth.rolemap: /etc/ftl/rolemap.txt
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: examples/18-3broker-sasl+mtls+oauth2/output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - ftlserver.properties:
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/client.pem
      tls.client.private.key: /etc/ftl/certs/client.key
      oauth2.validation.key: file:/etc/ftl/oauth.json
      oauth2.ui.client.id: ftl-ui
      oauth2.ui.client.secret: env:OAUTH_UI_CLIENT_SECRET
      oauth2.provider.trust.file: /etc/ftl/certs/oauth-provider.pem
      oauth2.svr.client.id: ftl-server
      oauth2.svr.client.secret: env:OAUTH_CLIENT_SECRET
      auth.rolemap: /etc/ftl/rolemap.txt
  - persistence:
      name: pserver2
      data: /var/kof/data/pserver2
      kof.broker.properties: examples/18-3broker-sasl+mtls+oauth2/output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - ftlserver.properties:
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/client.pem
      tls.client.private.key: /etc/ftl/certs/client.key
      oauth2.validation.key: file:/etc/ftl/oauth.json
      oauth2.ui.client.id: ftl-ui
      oauth2.ui.client.secret: env:OAUTH_UI_CLIENT_SECRET
      oauth2.provider.trust.file: /etc/ftl/certs/oauth-provider.pem
      oauth2.svr.client.id: ftl-server
      oauth2.svr.client.secret: env:OAUTH_CLIENT_SECRET
      auth.rolemap: /etc/ftl/rolemap.txt
  - persistence:
      name: pserver3
      data: /var/kof/data/pserver3
      kof.broker.properties: examples/18-3broker-sasl+mtls+oauth2/output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    user: primary
    password: primary-pw
    data: /var/kof/data
    initial.realm.config: examples/18-3broker-sasl+mtls+oauth2/output/realm.json
