# KOF Cluster Configuration
# Generated by tibkafkatokof from: server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster.yaml --server SRV1
#   tibftlserver --yaml kof-cluster.yaml --server SRV2
#   tibftlserver --yaml kof-cluster.yaml --server SRV3

globals:
  core.servers:
    SRV1: kafka-oauth-1:5686
    SRV2: kafka-oauth-2:5687
    SRV3: kafka-oauth-3:5688
  auth.providers: file:output/ftl-users.txt

servers:
  SRV1:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
  - persistence:
      name: pserver2
      data: /var/kof/data/pserver2
      kof.broker.properties: output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
  - persistence:
      name: pserver3
      data: /var/kof/data/pserver3
      kof.broker.properties: output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
    initial.realm.config: output/realm.json
