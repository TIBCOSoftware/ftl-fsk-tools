# KOF Cluster Configuration
# Generated by tibkafkatokof from: server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver -c kof-cluster.yaml -n SRV1
#   tibftlserver -c kof-cluster.yaml -n SRV2
#   tibftlserver -c kof-cluster.yaml -n SRV3

globals:
  core.servers:
    SRV1: kafka-oauth-1:5686
    SRV2: kafka-oauth-2:5687
    SRV3: kafka-oauth-3:5688

servers:
  SRV1:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - persistence:
      name: pserver2
      data: /var/tmp/kof/data/pserver2
      kof.broker.properties: output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - persistence:
      name: pserver3
      data: /var/tmp/kof/data/pserver3
      kof.broker.properties: output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

