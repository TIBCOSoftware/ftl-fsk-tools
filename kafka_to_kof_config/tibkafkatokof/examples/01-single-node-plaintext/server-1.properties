############################# Server Basics #############################
#
# Single-node Kafka in KRaft mode — no authentication, no TLS.
# Suitable for development and local testing only.
#
# KOF translation: tibkafkatokof --num-pservers 1 --output-dir ./kof-output server-1.properties
#
# Generates:
#   kof-cluster.yaml   — 1 realm server (SRV1) + 1 pserver (PSRV1)
#   realm.json         — kof.cluster.0 with a single pserver (pserver1) in _setA
#   kof.broker.properties
#
# KRaft: this node is both broker and controller (single-node quorum).
process.roles=broker,controller
node.id=1

# Single-node controller quorum — just this node.
controller.quorum.bootstrap.servers=kafka-single-1:9093

############################# Socket Server Settings #############################

# PLAINTEXT on 9092 for clients; CONTROLLER on 9093 for KRaft quorum.
listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
inter.broker.listener.name=PLAINTEXT
advertised.listeners=PLAINTEXT://kafka-single-1:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Log Basics #############################

log.dirs=/var/kafka/data/broker-1
num.partitions=1
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

# Single-node: replication factor must be 1.
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

############################# Log Flush Policy #############################

#log.flush.interval.messages=10000
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
