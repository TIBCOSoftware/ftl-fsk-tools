# KOF Cluster Configuration
# Generated by tibkafkatokof from: examples/01-single-node-plaintext/server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster.yaml --server SRV1

globals:
  core.servers:
    SRV1: kafka-single-1:5693

servers:
  SRV1:
  - realm: {}
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: examples/01-single-node-plaintext/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
    initial.realm.config: examples/01-single-node-plaintext/output/realm.json
