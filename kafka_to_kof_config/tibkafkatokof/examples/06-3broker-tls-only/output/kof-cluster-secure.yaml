# KOF Cluster — Secure Configuration
# Generated by tibkafkatokof from: examples/06-3broker-tls-only/server-1.properties
#
# Auth mode: tls-only
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV1
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV2
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV3

globals:
  core.servers:
    SRV1: kafka-broker-1:5619
    SRV2: kafka-broker-1:5647
    SRV3: kafka-broker-1:5663

servers:
  SRV1:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: examples/06-3broker-tls-only/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver2
      data: /var/kof/data/pserver2
      kof.broker.properties: examples/06-3broker-tls-only/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver3
      data: /var/kof/data/pserver3
      kof.broker.properties: examples/06-3broker-tls-only/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
    initial.realm.config: examples/06-3broker-tls-only/output/realm.json
