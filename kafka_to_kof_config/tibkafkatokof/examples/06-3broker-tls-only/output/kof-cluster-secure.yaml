# KOF Cluster — Secure Configuration
# Generated by tibkafkatokof from: examples/06-3broker-tls-only/server-1.properties
#
# Auth mode: tls-only
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver -c kof-cluster-secure.yaml -n SRV1
#   tibftlserver -c kof-cluster-secure.yaml -n SRV2
#   tibftlserver -c kof-cluster-secure.yaml -n SRV3

globals:
  core.servers:
    SRV1: localhost:5619
    SRV2: localhost:5647
    SRV3: localhost:5663

servers:
  SRV1:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: examples/06-3broker-tls-only/output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: examples/06-3broker-tls-only/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: examples/06-3broker-tls-only/output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver2
      data: /var/tmp/kof/data/pserver2
      kof.broker.properties: examples/06-3broker-tls-only/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: examples/06-3broker-tls-only/output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver3
      data: /var/tmp/kof/data/pserver3
      kof.broker.properties: examples/06-3broker-tls-only/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

