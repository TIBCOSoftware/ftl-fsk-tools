############################# Server Basics #############################

# KRaft mode: this node is both broker and controller.
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=kafka-broker-1:9093,kafka-broker-2:9093,kafka-broker-3:9093

############################# Socket Server Settings #############################

# BROKER listener: client-facing SASL_SSL.
# CONTROLLER listener: internal SSL only (no SASL for controller-to-controller).
listeners=BROKER://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
inter.broker.listener.name=BROKER
advertised.listeners=BROKER://kafka-broker-1:9092,CONTROLLER://kafka-broker-1:9093
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:SSL,BROKER:SASL_SSL
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# TLS / SSL Settings (shared baseline) #############################

ssl.keystore.type=JKS
ssl.keystore.location=/etc/kafka/certs/kafka-broker-1.keystore.jks
ssl.keystore.password=keystorePassword123
ssl.key.password=keyPassword123
ssl.truststore.type=JKS
ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
ssl.truststore.password=truststorePassword123
ssl.protocol=TLSv1.3
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.endpoint.identification.algorithm=https

############################# SASL Settings — PLAIN on the BROKER listener #############################

# Enable PLAIN for inter-broker SASL.
sasl.mechanism.inter.broker.protocol=PLAIN

# Per-listener SASL configuration for the BROKER listener.
listener.name.broker.sasl.enabled.mechanisms=PLAIN
listener.name.broker.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_producer="producer-secret" user_consumer="consumer-secret";

############################# CONTROLLER Listener — SSL only (internal) #############################

listener.name.controller.ssl.keystore.location=/etc/kafka/certs/kafka-broker-1.keystore.jks
listener.name.controller.ssl.keystore.password=keystorePassword123
listener.name.controller.ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
listener.name.controller.ssl.truststore.password=truststorePassword123

############################# Log Basics #############################

log.dirs=/var/kafka/data/broker-1
num.partitions=3
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

offsets.topic.replication.factor=3
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

############################# Log Flush Policy #############################

#log.flush.interval.messages=10000
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
