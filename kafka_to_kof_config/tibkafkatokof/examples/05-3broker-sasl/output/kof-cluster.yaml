# KOF Cluster Configuration
# Generated by tibkafkatokof from: examples/05-3broker-sasl/server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster.yaml --server SRV1
#   tibftlserver --yaml kof-cluster.yaml --server SRV2
#   tibftlserver --yaml kof-cluster.yaml --server SRV3

globals:
  core.servers:
    SRV1: kafka-broker-1:5638
    SRV2: kafka-broker-1:5647
    SRV3: kafka-broker-1:5680

servers:
  SRV1:
  - realm: {}
  - persistence:
      name: pserver1
      data: /data/kof/pserver1
      kof.broker.properties: examples/05-3broker-sasl/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - persistence:
      name: pserver2
      data: /data/kof/pserver2
      kof.broker.properties: examples/05-3broker-sasl/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - persistence:
      name: pserver3
      data: /data/kof/pserver3
      kof.broker.properties: examples/05-3broker-sasl/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /data/kof
  realm:
    data: /data/kof
    initial.realm.config: examples/05-3broker-sasl/output/realm.json
