# KOF Cluster — Secure Configuration
# Generated by tibkafkatokof from: server-1.properties
#
# Auth mode: file-auth+tls
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV1
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV2
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV3

globals:
  core.servers:
    SRV1: kafka-broker-1:5638
    SRV2: kafka-broker-1:5647
    SRV3: kafka-broker-1:5680
  auth.providers: file:/etc/ftl/users.txt

servers:
  SRV1:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.private.key.password: changeit
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver1
      data: /data/kof/pserver1
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.private.key.password: changeit
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver2
      data: /data/kof/pserver2
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.private.key.password: changeit
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver3
      data: /data/kof/pserver3
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /data/kof
  realm:
    data: /data/kof
