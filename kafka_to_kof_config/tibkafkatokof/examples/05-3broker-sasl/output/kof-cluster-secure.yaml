# KOF Cluster — Secure Configuration
# Generated by tibkafkatokof from: examples/05-3broker-sasl/server-1.properties
#
# Auth mode: file-auth+tls
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver -c kof-cluster-secure.yaml -n SRV1
#   tibftlserver -c kof-cluster-secure.yaml -n SRV2
#   tibftlserver -c kof-cluster-secure.yaml -n SRV3

globals:
  core.servers:
    SRV1: localhost:5638
    SRV2: localhost:5647
    SRV3: localhost:5680
  auth.providers: file:/etc/ftl/users.txt

servers:
  SRV1:
  - realm:
      data: /data/kof
      initial.realm.config: examples/05-3broker-sasl/output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.private.key.password: changeit
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver1
      data: /data/kof/pserver1
      kof.broker.properties: examples/05-3broker-sasl/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm:
      data: /data/kof
      initial.realm.config: examples/05-3broker-sasl/output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.private.key.password: changeit
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver2
      data: /data/kof/pserver2
      kof.broker.properties: examples/05-3broker-sasl/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm:
      data: /data/kof
      initial.realm.config: examples/05-3broker-sasl/output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.private.key.password: changeit
      tls.client.trust.file: /etc/ftl/certs/ca.pem
  - persistence:
      name: pserver3
      data: /data/kof/pserver3
      kof.broker.properties: examples/05-3broker-sasl/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

