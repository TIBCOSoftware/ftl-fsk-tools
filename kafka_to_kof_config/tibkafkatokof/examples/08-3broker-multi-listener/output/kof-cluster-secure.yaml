# KOF Cluster — Secure Configuration
# Generated by tibkafkatokof from: examples/08-3broker-multi-listener/server-1.properties
#
# Auth mode: oauth2
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV1
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV2
#   tibftlserver --yaml kof-cluster-secure.yaml --server SRV3

globals:
  core.servers:
    SRV1: kafka-broker-1:5611
    SRV2: kafka-broker-1:5656
    SRV3: kafka-broker-1:5676
  auth.providers: oauth2
  oauth2.claim.roles: group
  oauth2.claim.username: preferred_username
  oauth2.audience: ftl
  oauth2.svr.endpoint.token: https://auth.example.com/oauth/token

servers:
  SRV1:
  - realm: {}
  - ftlserver.properties:
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/internal.pem
      tls.client.private.key: /etc/ftl/certs/internal.key
      oauth2.validation.key: file:/etc/ftl/oauth.json
      oauth2.provider.trust.file: /etc/ftl/certs/oauth-provider.pem
      oauth2.svr.client.id: ftl-server
      oauth2.svr.client.secret: env:OAUTH_CLIENT_SECRET
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: examples/08-3broker-multi-listener/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - ftlserver.properties:
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/internal.pem
      tls.client.private.key: /etc/ftl/certs/internal.key
      oauth2.validation.key: file:/etc/ftl/oauth.json
      oauth2.provider.trust.file: /etc/ftl/certs/oauth-provider.pem
      oauth2.svr.client.id: ftl-server
      oauth2.svr.client.secret: env:OAUTH_CLIENT_SECRET
  - persistence:
      name: pserver2
      data: /var/kof/data/pserver2
      kof.broker.properties: examples/08-3broker-multi-listener/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - ftlserver.properties:
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.private.key: /etc/ftl/certs/server.key
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/internal.pem
      tls.client.private.key: /etc/ftl/certs/internal.key
      oauth2.validation.key: file:/etc/ftl/oauth.json
      oauth2.provider.trust.file: /etc/ftl/certs/oauth-provider.pem
      oauth2.svr.client.id: ftl-server
      oauth2.svr.client.secret: env:OAUTH_CLIENT_SECRET
  - persistence:
      name: pserver3
      data: /var/kof/data/pserver3
      kof.broker.properties: examples/08-3broker-multi-listener/output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
    initial.realm.config: examples/08-3broker-multi-listener/output/realm.json
