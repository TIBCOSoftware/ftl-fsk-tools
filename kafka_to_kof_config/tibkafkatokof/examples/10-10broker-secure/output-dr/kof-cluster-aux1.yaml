# KOF Auxiliary Cluster Configuration (group 2)
# Generated by tibkafkatokof from: server-1.properties
#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver --yaml kof-cluster-aux1.yaml --server PSRV4

globals:
  core.servers:
    SRV1: kafka-broker-1:5672
    SRV2: kafka-broker-1:5617
    SRV3: kafka-broker-1:5659
  dr: drserver1@dr-host-1:9585|drserver2@dr-host-2:9686|drserver3@dr-host-3:9787
  auto.init.primary.on.first.startup: true

servers:
  PSRV4:
  - ftl:
      server: kafka-broker-1:5777
  - persistence:
      name: pserver4
      data: /var/kof/data/pserver4
      kof.broker.properties: output-dr/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV5:
  - ftl:
      server: kafka-broker-1:5736
  - persistence:
      name: pserver5
      data: /var/kof/data/pserver5
      kof.broker.properties: output-dr/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV6:
  - ftl:
      server: kafka-broker-1:5730
  - persistence:
      name: pserver6
      data: /var/kof/data/pserver6
      kof.broker.properties: output-dr/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
