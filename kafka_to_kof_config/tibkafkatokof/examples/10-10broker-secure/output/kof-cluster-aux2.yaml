# KOF Auxiliary Cluster Configuration (group 3)
# Generated by tibkafkatokof from: server-1.properties
#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver -c kof-cluster-aux2.yaml -n PSRV7

globals:
  core.servers:
    SRV1: localhost:5601
    SRV2: localhost:5602
    SRV3: localhost:5603

servers:
  PSRV7:
  - ftl:
      server: localhost:5728
  - persistence:
      name: pserver7
      data: /var/tmp/kof/data/pserver7
      kof.broker.properties: output/kof.broker.7.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV8:
