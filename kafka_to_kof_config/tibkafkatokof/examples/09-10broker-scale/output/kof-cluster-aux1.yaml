# KOF Auxiliary Cluster Configuration (group 2)
# Generated by tibkafkatokof from: server-1.properties
#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver --yaml kof-cluster-aux1.yaml --server PSRV4

globals:
  core.servers:
    SRV1: kof-realm-1:5600
    SRV2: kof-realm-2:5601
    SRV3: kof-realm-3:5602

servers:
  PSRV4:
  - ftl:
      server: kafka-broker-1:5720
  - persistence:
      name: pserver4
      data: /var/kof/pserver4
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV5:
  - ftl:
      server: kafka-broker-1:5780
  - persistence:
      name: pserver5
      data: /var/kof/pserver5
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV6:
  - ftl:
      server: kafka-broker-1:5799
  - persistence:
      name: pserver6
      data: /var/kof/pserver6
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof
