# KOF Auxiliary Cluster Configuration (group 2)
# Generated by tibkafkatokof from: examples/09-10broker-scale/server-1.properties
#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver -c kof-cluster-aux1.yaml -n PSRV4

globals:
  core.servers:
    SRV1: localhost:5619
    SRV2: localhost:5698
    SRV3: localhost:5635

servers:
  PSRV4:
  - ftl:
      server: localhost:5703
  - persistence:
      name: pserver4
      data: /var/tmp/kof/data/pserver4
      kof.broker.properties: examples/09-10broker-scale/output/kof.broker.4.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV5:
  - ftl:
      server: localhost:5710
  - persistence:
      name: pserver5
      data: /var/tmp/kof/data/pserver5
      kof.broker.properties: examples/09-10broker-scale/output/kof.broker.5.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV6:
  - ftl:
      server: localhost:5754
  - persistence:
      name: pserver6
      data: /var/tmp/kof/data/pserver6
      kof.broker.properties: examples/09-10broker-scale/output/kof.broker.6.properties
      loglevel: connections:info;kof:info;durables:info;store:info

