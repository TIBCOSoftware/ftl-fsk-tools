# KOF Auxiliary Cluster Configuration (group 2)
# Generated by tibkafkatokof from: server-1.properties
#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver --yaml kof-cluster-aux1.yaml --server PSRV4

globals:
  core.servers:
    SRV1: kafka-cluster-1:5601
    SRV2: kafka-cluster-2:5602
    SRV3: kafka-cluster-3:5603

servers:
  PSRV4:
  - ftl:
      server: kafka-broker-1:5781
  - persistence:
      name: pserver4
      data: /var/kof/data/pserver4
      kof.broker.properties: output/kof.broker.4.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV5:
  - ftl:
      server: kafka-broker-1:5701
  - persistence:
      name: pserver5
      data: /var/kof/data/pserver5
      kof.broker.properties: output/kof.broker.5.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV6:
  - ftl:
      server: kafka-broker-1:5754
  - persistence:
      name: pserver6
      data: /var/kof/data/pserver6
      kof.broker.properties: output/kof.broker.6.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
