# --- Listeners ---
listeners=PLAIN_SASL://0.0.0.0:9092,OAUTH://0.0.0.0:9094,MTLS://0.0.0.0:9095,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAIN_SASL://kafka-broker-1:9092,OAUTH://kafka-broker-1:9094,MTLS://kafka-broker-1:9095,CONTROLLER://kafka-broker-1:9093
listener.security.protocol.map=CONTROLLER:SSL,PLAIN_SASL:SASL_SSL,OAUTH:SASL_SSL,MTLS:SSL
inter.broker.listener.name=PLAIN_SASL
controller.listener.names=CONTROLLER
listener.name.plain_sasl.sasl.enabled.mechanisms=PLAIN
