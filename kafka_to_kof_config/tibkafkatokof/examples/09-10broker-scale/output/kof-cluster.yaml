# KOF Cluster Configuration
# Generated by tibkafkatokof from: examples/09-10broker-scale/server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster.yaml --server SRV1
#   tibftlserver --yaml kof-cluster.yaml --server SRV2
#   tibftlserver --yaml kof-cluster.yaml --server SRV3

globals:
  core.servers:
    SRV1: kafka-broker-1:5619
    SRV2: kafka-broker-1:5698
    SRV3: kafka-broker-1:5635
  auth.providers: file:examples/09-10broker-scale/output/ftl-users.txt

servers:
  SRV1:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
  - persistence:
      name: pserver1
      data: /var/kof/data/pserver1
      kof.broker.properties: examples/09-10broker-scale/output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
  - persistence:
      name: pserver2
      data: /var/kof/data/pserver2
      kof.broker.properties: examples/09-10broker-scale/output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - ftlserver.properties:
      user: internal
      password: internal-pw
  - persistence:
      name: pserver3
      data: /var/kof/data/pserver3
      kof.broker.properties: examples/09-10broker-scale/output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof/data
  realm:
    data: /var/kof/data
    initial.realm.config: examples/09-10broker-scale/output/realm.json
