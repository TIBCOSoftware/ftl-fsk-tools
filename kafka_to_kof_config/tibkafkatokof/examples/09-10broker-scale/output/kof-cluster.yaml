# KOF Cluster Configuration
# Generated by tibkafkatokof from: server-1.properties
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver --yaml kof-cluster.yaml --server SRV1
#   tibftlserver --yaml kof-cluster.yaml --server SRV2
#   tibftlserver --yaml kof-cluster.yaml --server SRV3

globals:
  core.servers:
    SRV1: kof-realm-1:5600
    SRV2: kof-realm-2:5601
    SRV3: kof-realm-3:5602

servers:
  SRV1:
  - realm: {}
  - persistence:
      name: pserver1
      data: /var/kof/pserver1
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm: {}
  - persistence:
      name: pserver2
      data: /var/kof/pserver2
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm: {}
  - persistence:
      name: pserver3
      data: /var/kof/pserver3
      kof.broker.properties: output/kof.broker.properties
      loglevel: connections:info;kof:info;durables:info;store:info

services:
  persistence:
    data: /var/kof
  realm:
    data: /var/kof
