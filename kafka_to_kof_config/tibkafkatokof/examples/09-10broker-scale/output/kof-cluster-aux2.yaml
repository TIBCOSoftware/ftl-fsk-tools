#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver -c kof-cluster-aux2.yaml -n PSRV7

globals:
  core.servers:
    SRV1: localhost:5619
    SRV2: localhost:5698
    SRV3: localhost:5635

servers:
