# KOF Cluster — Secure Configuration
# Generated by tibkafkatokof from: server-1.properties
#
# Auth providers: file:/etc/ftl/users.txt,mtls
#
# Start the cluster (one tibftlserver per SRV entry):
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV1
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV2
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV3

globals:
  core.servers:
    SRV1: kafka-sasl-mtls-1:5692
    SRV2: kafka-sasl-mtls-2:5693
    SRV3: kafka-sasl-mtls-3:5694
  auth.providers: file:/etc/ftl/users.txt,mtls

servers:
  SRV1:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/client.pem
      tls.client.private.key: /etc/ftl/certs/client.key
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/client.pem
      tls.client.private.key: /etc/ftl/certs/client.key
  - persistence:
      name: pserver2
      data: /var/tmp/kof/data/pserver2
      kof.broker.properties: output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.trust.file: /etc/ftl/certs/ca.pem
      tls.client.cert: /etc/ftl/certs/client.pem
      tls.client.private.key: /etc/ftl/certs/client.key
  - persistence:
      name: pserver3
      data: /var/tmp/kof/data/pserver3
      kof.broker.properties: output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

