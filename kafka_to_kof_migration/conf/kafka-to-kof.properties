# Source Kafka cluster
source.bootstrap.servers=localhost:9092

# Target KOF brokers
target.bootstrap.servers=localhost:5663,localhost:5673,localhost:5683

# Topic selection
topic.pattern=.*
include.internal=false

# Target topic settings
target.replication.factor=1

# Runtime settings
client.id=kafka-to-kof-replicator
request.timeout.ms=60000
max.empty.polls=15
dry.run=false

# Optional pass-through Kafka client properties
# source.admin.security.protocol=SASL_SSL
# source.admin.sasl.mechanism=PLAIN
# source.admin.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="user" password="pass";
# source.consumer.security.protocol=SASL_SSL
# target.admin.security.protocol=SASL_SSL
# target.producer.security.protocol=SASL_SSL

# Records per batch per partition before flushing to KOF
batch.size=1000
