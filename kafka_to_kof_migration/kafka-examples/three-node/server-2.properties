# Kafka 4.x KRaft — broker 2 of 3 (no ZooKeeper)
# Differs from server-1.properties only in node.id, listener ports, and log.dirs.

process.roles=broker,controller
node.id=2

controller.quorum.voters=1@localhost:9911,2@localhost:9912,3@localhost:9913
controller.listener.names=CONTROLLER

listeners=PLAINTEXT://localhost:9093,CONTROLLER://localhost:9912
advertised.listeners=PLAINTEXT://localhost:9093
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

log.dirs=/tmp/kafka-examples/broker-2

num.partitions=3
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
