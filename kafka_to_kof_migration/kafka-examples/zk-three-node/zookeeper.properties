# ZooKeeper for the three-node example cluster.
# Requires Kafka 3.9 or earlier — Kafka 4.x removed ZooKeeper support.
#
# A single ZooKeeper instance serves all three brokers. That is intentional:
# it keeps the example simple. A production deployment would run a ZooKeeper
# ensemble of 3 or 5 nodes.

dataDir=/tmp/kafka-examples-zk/zookeeper
clientPort=2181
maxClientCnxns=0
admin.enableServer=false
