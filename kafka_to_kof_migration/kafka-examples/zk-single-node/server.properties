# Kafka ZooKeeper mode — single-node cluster
#
# Requires Kafka 3.9 or earlier. Kafka 4.x removed ZooKeeper support entirely,
# so this file will not start under a 4.x installation.
#
#   bash kafka-examples/start-kafka-zk.sh single-node
#
# Bootstrap server: localhost:9092

broker.id=1

# Listeners. PLAINTEXT is the only listener and also carries inter-broker
# traffic. There is no CONTROLLER listener in ZooKeeper mode — the controller
# is elected through ZooKeeper rather than a KRaft quorum.
listeners=PLAINTEXT://localhost:9092
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=PLAINTEXT:PLAINTEXT

# ZooKeeper connection
zookeeper.connect=localhost:2181
zookeeper.connection.timeout.ms=18000

# Data storage
log.dirs=/tmp/kafka-examples-zk/broker-1

# Topic defaults. Everything is 1 because there is only one broker —
# a replication factor above 1 would leave topics permanently under-replicated.
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

# Log retention
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Socket / thread settings
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
