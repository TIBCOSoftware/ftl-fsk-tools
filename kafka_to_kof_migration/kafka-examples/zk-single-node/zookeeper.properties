# ZooKeeper for the single-node example cluster.
# Requires Kafka 3.9 or earlier — Kafka 4.x removed ZooKeeper support.

dataDir=/tmp/kafka-examples-zk/zookeeper
clientPort=2181

# 0 = unlimited connections per client host; fine for a local example.
maxClientCnxns=0

# The AdminServer binds 8080 by default, which collides with all sorts of
# things on a developer machine. Not needed here.
admin.enableServer=false
