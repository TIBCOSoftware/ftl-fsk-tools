# KRaft server.properties — broker 1 of 3 (insurance demo cluster)
# Kafka 4.x KRaft mode: no ZooKeeper required.
# Used by demo/setup-kafka-kraft.sh

process.roles=broker,controller
node.id=1

# Controller quorum — all 3 brokers participate as controllers
# kafka-storage.sh format requires controller.quorum.voters (static list)
controller.quorum.voters=1@localhost:9911,2@localhost:9912,3@localhost:9913
controller.listener.names=CONTROLLER

# Listeners
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9911
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

# Data storage
log.dirs=/tmp/kafka-kraft/broker-1

# Cluster defaults (overridden per-topic by create-topics.sh)
num.partitions=3
default.replication.factor=1
min.insync.replicas=1

# Log retention
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Socket / thread settings
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
