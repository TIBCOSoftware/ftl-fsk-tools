<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SVG Test</title>
<style>
body { margin:0; background:#111; color:#fff; font-family:sans-serif; }
#msg { padding:10px; font-size:13px; background:#1a2a1a; }
</style>
</head>
<body>
<div id="msg">If you see the orange broker mesh, blue KOF mesh, and blue tube below, the browser can render SVG+Canvas.</div>

<!-- Kafka SVG: hardcoded 265x350 -->
<svg id="k" width="265" height="350" style="border:2px solid #f97316;display:block;float:left;background:#161b22;"></svg>

<!-- Conduit canvas: hardcoded 400x350 -->
<canvas id="cv" width="400" height="350" style="border:2px solid #3b82f6;display:block;float:left;background:#0d1117;"></canvas>

<!-- KOF SVG: hardcoded 265x350 -->
<svg id="ko" width="265" height="350" style="border:2px solid #3b82f6;display:block;float:left;background:#161b22;"></svg>

<div style="clear:both;padding:10px;font-size:11px;" id="log"></div>

<script>
var log = document.getElementById('log');
function lg(s){ log.innerHTML += s + '<br>'; }

var ns = 'http://www.w3.org/2000/svg';

function drawMesh(svgEl, W, H, color, labels) {
  lg('Drawing mesh: ' + svgEl.id + ' W=' + W + ' H=' + H);
  var cx = W/2, cy = H*0.42, R = Math.min(W,H)*0.27;
  function mk(tag, a) { var e=document.createElementNS(ns,tag); for(var k in a) e.setAttribute(k,a[k]); return e; }
  function tx(x,y,s,fs) { var e=mk('text',{x:x,y:y,'text-anchor':'middle','font-family':'sans-serif','font-size':fs,'fill':color,'font-weight':'bold'}); e.textContent=s; return e; }

  svgEl.appendChild(mk('circle',{cx:cx,cy:cy,r:R+20,fill:'none',stroke:color,'stroke-width':'1','stroke-opacity':'.15','stroke-dasharray':'6 4'}));
  svgEl.appendChild(mk('circle',{cx:cx,cy:cy,r:'8',fill:color,'fill-opacity':'.3',stroke:color,'stroke-width':'1.5'}));

  var pts = labels.map(function(_,i){
    var a = (i/labels.length)*2*Math.PI - Math.PI/2;
    return { x: cx + R*Math.cos(a), y: cy + R*Math.sin(a) };
  });

  for(var i=0;i<pts.length;i++) for(var j=i+1;j<pts.length;j++)
    svgEl.appendChild(mk('line',{x1:pts[i].x,y1:pts[i].y,x2:pts[j].x,y2:pts[j].y,stroke:color,'stroke-width':'1.5','stroke-opacity':'.25'}));

  pts.forEach(function(p,i){
    var nr = R*0.34;
    svgEl.appendChild(mk('circle',{cx:p.x,cy:p.y,r:nr+6,fill:'none',stroke:'#22c55e','stroke-width':'1.5','stroke-opacity':'.5'}));
    svgEl.appendChild(mk('circle',{cx:p.x,cy:p.y,r:nr,fill:color,'fill-opacity':'.15',stroke:color,'stroke-width':'2'}));
    var bw=nr*1.1, bx=p.x-bw/2;
    [-5,0,5].forEach(function(dy){
      svgEl.appendChild(mk('rect',{x:bx,y:p.y+dy-2,width:bw,height:'4',rx:'1.2',fill:color}));
      svgEl.appendChild(mk('circle',{cx:bx+bw-4,cy:p.y+dy,r:'1.8',fill:'#22c55e'}));
    });
    svgEl.appendChild(tx(p.x, p.y+nr+16, labels[i], 13));
  });
  svgEl.appendChild(tx(cx, H-8, 'Cluster', 10));
  lg('Done: ' + svgEl.id);
}

// Draw Kafka mesh
drawMesh(document.getElementById('k'), 265, 350, '#f97316', ['Broker-1','Broker-2','Broker-3']);

// Draw KOF mesh
drawMesh(document.getElementById('ko'), 265, 350, '#3b82f6', ['Node-1','Node-2','Node-3']);

// Draw conduit
var cv = document.getElementById('cv');
var ctx = cv.getContext('2d');
var W=400, H=350;
var pX=30, pW=340, pCY=175, pH=120, pY=pCY-pH/2;
var bg = ctx.createLinearGradient(0,pY,0,pY+pH);
bg.addColorStop(0,'rgba(55,90,150,.98)'); bg.addColorStop(.5,'rgba(6,12,30,.99)'); bg.addColorStop(1,'rgba(55,90,150,.98)');
ctx.fillStyle=bg; ctx.fillRect(pX,pY,pW,pH);
ctx.strokeStyle='#f97316'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(pX,pY); ctx.lineTo(pX+pW,pY); ctx.stroke();
ctx.strokeStyle='#3b82f6'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(pX,pY+pH); ctx.lineTo(pX+pW,pY+pH); ctx.stroke();
ctx.font='bold 12px sans-serif'; ctx.fillStyle='#aaa'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('DATA CONDUIT',W/2,pCY);
lg('Canvas conduit drawn');
lg('<b>All  check what you see above</b>');done 
</script>
</body>
</html>
