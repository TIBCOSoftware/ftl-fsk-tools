<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kafka to KOF Migration Console</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f0f4f8;color:#1a202c;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;}
/* HEADER */
#hdr{width:100%;height:54px;background:#161b22;border-bottom:2px solid #30363d;display:flex;align-items:center;padding:0 18px;gap:14px;position:relative;z-index:10;}
#hdr h1{font-size:16px;font-weight:800;white-space:nowrap;}
.sub{font-size:10px;color:#8b949e;}
.hstats{display:flex;gap:20px;margin-left:auto;align-items:center;}
.hstat{display:flex;flex-direction:column;align-items:center;line-height:1.2;}
.hstat-v{font-size:18px;font-weight:800;}.hstat-l{font-size:8px;color:#8b949e;text-transform:uppercase;letter-spacing:.6px;}
#h-topics{color:#f97316;}#h-pub{color:#22c55e;}
#theme-btn{padding:5px 13px;border-radius:20px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;font-size:14px;}
.pill{display:flex;align-items:center;gap:7px;padding:5px 14px;border-radius:20px;border:1px solid #30363d;background:#21262d;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.dot{width:9px;height:9px;border-radius:50%;background:#8b949e;}
.pill.running .dot{background:#22c55e;animation:blink 1s infinite;}
.pill.done .dot{background:#22c55e;}.pill.error .dot{background:#ef4444;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
/* MAIN  3 columns side by side */
#toprow{display:block;white-space:nowrap;overflow:hidden;font-size:0;}
#kafka-col{display:inline-block;vertical-align:top;background:#161b22;border-right:2px solid #30363d;}
#mid-col{display:inline-block;vertical-align:top;background:#0d1117;}
#kof-col{display:inline-block;vertical-align:top;background:#161b22;border-left:2px solid #30363d;}
.col-hdr{height:40px;padding:0 12px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px;white-space:normal;}
.bdg{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:800;}
.kb{background:rgba(249,115,22,.15);color:#f97316;border:1px solid rgba(249,115,22,.45);}
.ob{background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.45);}
/* BOTTOM ROW */
#botrow{display:flex;border-top:2px solid #30363d;}
.pane{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0d1117;}
.pane+.pane{border-left:2px solid #30363d;}
.phdr{height:34px;background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;padding:0 14px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#8b949e;gap:8px;flex-shrink:0;white-space:normal;}
.pbody{flex:1;overflow-y:auto;padding:12px;}
.pbody::-webkit-scrollbar{width:4px;}.pbody::-webkit-scrollbar-thumb{background:#30363d;}
label{font-size:13px;color:#8b949e;font-weight:700;}
input{background:#21262d;border:1px solid #30363d;color:#e6edf3;padding:7px 10px;border-radius:5px;font-size:13px;outline:none;width:100%;}
input:focus{border-color:#3b82f6;}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fg{display:flex;flex-direction:column;gap:3px;}.fg.full{grid-column:1/-1;}
.cbr{display:flex;align-items:center;gap:7px;padding-top:6px;}.cbr input{width:14px;height:14px;accent-color:#3b82f6;}
.btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.btn{padding:8px 20px;border-radius:6px;border:none;font-size:13px;font-weight:800;cursor:pointer;}
.btn:disabled{opacity:.35;cursor:default;}
.brun{background:#22c55e;color:#000;}.bdry{background:#eab308;color:#000;}.bstp{background:#ef4444;color:#fff;}
.bclr{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.bstat{background:rgba(249,115,22,.15);color:#f97316;border:1px solid rgba(249,115,22,.4);}
#term{flex:1;overflow-y:auto;background:#060a0f;padding:10px;font-family:monospace;font-size:11.5px;line-height:1.55;white-space:pre-wrap;word-break:break-all;}
.lo{color:#c9d1d9;}.le{color:#fbbf24;}.ls{color:#3d4f6b;font-style:italic;}.lb{color:#f87171;}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-left:6px;}
.chip{padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:#3b82f6;}
.chip.lit{background:rgba(59,130,246,.5);}
#cmdprev{font-size:9px;color:#8b949e;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:50%;opacity:.6;}
#stats-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);}
#stats-modal.open{display:flex;align-items:center;justify-content:center;}
#stats-box{background:#161b22;border:1px solid #30363d;border-radius:12px;width:560px;max-height:80vh;overflow-y:auto;padding:22px;}
#stats-box h2{font-size:14px;font-weight:800;color:#f97316;margin-bottom:14px;}
.strow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.stcard{background:#21262d;border:1px solid #30363d;border-radius:8px;padding:10px 14px;flex:1;min-width:100px;}
.stcard-l{font-size:9px;color:#8b949e;text-transform:uppercase;margin-bottom:4px;}
.stcard-v{font-size:18px;font-weight:800;}
.broker-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#21262d;border:1px solid #30363d;border-radius:6px;margin-bottom:6px;}
.bst{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.bst.online{background:#22c55e;box-shadow:0 0 6px #22c55e88;}.bst.offline{background:#ef4444;}.bst.unknown{background:#8b949e;}
.binfo{flex:1;font-size:11px;}.binfo b{font-weight:800;}.binfo small{color:#8b949e;font-size:9px;}
.topic-chip{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:700;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.3);color:#f97316;margin:2px;}
#stats-close{float:right;background:transparent;border:1px solid #30363d;color:#8b949e;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:11px;}
</style>
</head>
<body>

<!-- HEADER -->
<div id="hdr">
  <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
    <circle cx="13" cy="4"  r="3.5" fill="#f97316"/>
    <circle cx="13" cy="22" r="3.5" fill="#f97316"/>
    <circle cx="4"  cy="13" r="3.5" fill="#f97316"/>
    <circle cx="22" cy="13" r="3.5" fill="#f97316"/>
    <line x1="13" y1="4"  x2="4"  y2="13" stroke="#f97316" stroke-width="1.8"/>
    <line x1="4"  y1="13" x2="13" y2="22" stroke="#f97316" stroke-width="1.8"/>
    <line x1="13" y1="22" x2="22" y2="13" stroke="#f97316" stroke-width="1.8"/>
    <line x1="22" y1="13" x2="13" y2="4"  stroke="#f97316" stroke-width="1.8"/>
  </svg>
  <div>
    <h1>Kafka &rarr; KOF Migration Console</h1>
    <div class="sub">TIBCO FTL &nbsp;&middot;&nbsp; Hydra Store &nbsp;&middot;&nbsp; Insurance Demo</div>
  </div>
  <div class="hstats">
    <div class="hstat"><span class="hstat-v" id="h-topics">0</span><span class="hstat-l">Topics</span></div>
    <div class="hstat"><span class="hstat-v" id="h-planned">0</span><span class="hstat-l">Planned</span></div>
    <div class="hstat"><span class="hstat-v" id="h-pub">0</span><span class="hstat-l">Published</span></div>
    <div class="hstat"><span class="hstat-v" id="h-el">--</span><span class="hstat-l">Elapsed</span></div>
  </div>
  <button id="theme-btn">&#9728;</button>
  <div class="pill" id="pill"><div class="dot"></div><span id="pilltxt">Idle</span></div>
</div>

<!-- TOP ROW: 3 inline-block columns -->
<div id="toprow">
  <!-- LEFT: Kafka -->
  <div id="kafka-col">
    <div class="col-hdr" style="color:#f97316;">
      Apache Kafka &nbsp;<span class="bdg kb">3-Broker</span>
      <button class="btn bstat" style="margin-left:auto;font-size:9px;padding:3px 9px;" onclick="getKafkaStats()">&#8635; Stats</button>
    </div>
    <svg id="ksvg" style="display:block;background:#161b22;"></svg>
  </div>
  <!-- CENTER: Conduit -->
  <div id="mid-col">
    <canvas id="cv" style="display:block;"></canvas>
  </div>
  <!-- RIGHT: KOF -->
  <div id="kof-col">
    <div class="col-hdr" style="color:#3b82f6;">
      TIBCO KOF &nbsp;<span class="bdg ob">3-Node</span>
    </div>
    <svg id="kosvg" style="display:block;background:#161b22;"></svg>
    <canvas id="dbcv" style="display:block;border-top:1px solid #30363d;"></canvas>
  </div>
</div>

<!-- RESIZE HANDLE -->
<div id="drag-handle" style="width:100%;height:6px;background:#30363d;cursor:ns-resize;flex-shrink:0;"></div>
<!-- BOTTOM ROW -->
<div id="botrow">
  <div class="pane">
    <div class="phdr">Configuration <span class="chips" id="chips"></span></div>
    <div class="pbody">
      <div class="fg full" style="margin-bottom:8px;">
        <label>KAFKA_CLASSPATH (required)</label>
        <input id="f-cp" placeholder="e.g. $KAFKA_HOME/libs/*">
      </div>
      <div class="fg2">
        <div class="fg"><label>Source Bootstrap</label><input id="f-src" value="localhost:9092,localhost:9093,localhost:9094"></div>
        <div class="fg"><label>Target KOF Bootstrap</label><input id="f-tgt" value="localhost:9092,localhost:9093,localhost:9094"></div>
        <div class="fg"><label>Topic Pattern</label><input id="f-tp" value=".*"></div>
        <div class="fg"><label>Replication Factor</label><input id="f-rf" type="number" value="1"></div>
        <div class="fg"><label>Client ID</label><input id="f-cid" value="kafka-to-kof-migrator"></div>
        <div class="fg"><label>Request Timeout (ms)</label><input id="f-to" type="number" value="60000"></div>
        <div class="fg"><label>Max Empty Polls</label><input id="f-mp" type="number" value="15"></div>
        <div class="fg"><label>Config File</label><input id="f-cfg" value="../kof-output/kafka-to-kof.properties"></div>
        <div class="fg"><div class="cbr"><input id="f-int" type="checkbox"><label for="f-int">Include Internal Topics</label></div></div>
        <div class="fg"><div class="cbr"><input id="f-dry" type="checkbox"><label for="f-dry">Dry Run</label></div></div>
      </div>
      <div class="btns">
        <button class="btn brun" id="btn-run">&#9654; Run</button>
        <button class="btn bdry" id="btn-dry">&#9889; Dry Run</button>
        <button class="btn bstp" id="btn-stp" disabled>&#9632; Stop</button>
        <button class="btn bclr" id="btn-clr">&#10005; Clear</button>
      </div>
    </div>
  </div>
  <div class="pane">
    <div class="phdr">Shell Output <span id="cmdprev"></span></div>
    <div id="term"></div>
  </div>
</div>

<!-- STATS MODAL -->
<div id="stats-modal">
  <div id="stats-box">
    <button id="stats-close" onclick="closeStats()">&#10005; Close</button>
    <h2>&#9658; Kafka Cluster Stats</h2>
    <div id="stats-content"><p style="color:#8b949e;font-size:12px;">Loading...</p></div>
  </div>
</div>

<script>
// Size constants (computed once, updated on resize)
var SIDE = 265;   /* left/right panel width px */
var BOT  = 275;   /* bottom row height px */

(function(){
  var handle=document.getElementById('drag-handle');
  var dragging=false, startY=0, startBOT=0;
  handle.addEventListener('mousedown',function(e){
    dragging=true; startY=e.clientY; startBOT=BOT;
    document.body.style.userSelect='none'; e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging) return;
    var dy=startY-e.clientY;
    BOT=Math.max(120,Math.min(window.innerHeight-200,startBOT+dy));
    applyLayout(); drawKafka(); drawKof(); drawDbCylinder(); if(typeof drawConduit==='function') drawConduit();
  });
  document.addEventListener('mouseup',function(){ dragging=false; document.body.style.userSelect=''; });
})();

var HDR  = 54;    /* header height px */
var topH, midW, koH, dbH;

function calcSizes() {
  topH = window.innerHeight - HDR - BOT;
  midW = window.innerWidth  - SIDE * 2 - 4;
  koH  = Math.floor((topH - 40) * 0.60);
  dbH  = (topH - 40) - koH;
}

function applyLayout() {
  calcSizes();
  var svgBodyH = topH - 40;

  document.getElementById('kafka-col').style.width  = SIDE + 'px';
  document.getElementById('kafka-col').style.height = topH + 'px';
  document.getElementById('mid-col').style.width    = midW + 'px';
  document.getElementById('mid-col').style.height   = topH + 'px';
  document.getElementById('kof-col').style.width    = SIDE + 'px';
  document.getElementById('kof-col').style.height   = topH + 'px';

  document.getElementById('botrow').style.height = BOT + 'px';

  var ksvg = document.getElementById('ksvg');
  ksvg.setAttribute('width',  SIDE);
  ksvg.setAttribute('height', svgBodyH);

  var kosvg = document.getElementById('kosvg');
  kosvg.setAttribute('width',  SIDE);
  kosvg.setAttribute('height', koH);

  var dbcv = document.getElementById('dbcv');
  dbcv.setAttribute('width',  SIDE);
  dbcv.setAttribute('height', dbH);
  dbcv.width  = SIDE;
  dbcv.height = dbH;

  var cv = document.getElementById('cv');
  cv.setAttribute('width',  midW);
  cv.setAttribute('height', topH);
  cv.width  = midW;
  cv.height = topH;
}

// Theme toggle
var darkMode = false;
document.getElementById('theme-btn').onclick = function(){
  darkMode = !darkMode;
  document.body.style.background = darkMode ? '#0d1117' : '#f0f4f8';
  document.body.style.color      = darkMode ? '#e6edf3' : '#1a202c';
  this.textContent = darkMode ? '☾' : '☀';
  drawKafka(); drawKof(); drawDbCylinder();
};

// App state
var appSt = {status:'idle', topics:[], stats:{planned:0, published:0}};
var startTs=null, elTmr=null, kafkaCl=null, kofCl=null;
var dbFill=0, dbTarget=0;

// WebSocket
var ws = new WebSocket('ws://' + location.host);
ws.onmessage = function(e){ handle(JSON.parse(e.data)); };
ws.onclose   = function(){ log('s','-- WebSocket disconnected --'); };

function handle(m){
  if(m.type==='state'){ appSt=m.state; sync(); }
  else if(m.type==='status'){
    appSt.status=m.status; sync();
    if(m.status==='running'){ startTs=Date.now(); startTmr(); }
    if(m.status==='done'||m.status==='error') stopTmr();
  }
  else if(m.type==='log'){ log(m.stream==='stdout'?'o':m.stream==='stderr'?'e':'s',m.line); }
  else if(m.type==='topic_discovered'){ if(!appSt.topics.includes(m.topic)) appSt.topics.push(m.topic); renderChips(); upHdr(); }
  else if(m.type==='stats'){ appSt.stats=m.stats; upHdr(); dbTarget=Math.min(appSt.stats.published/50000,1); }
  else if(m.type==='flow'){ flowAnim(m.topic); }
  else if(m.type==='kafka_cluster'){ kafkaCl=m.cluster; drawKafka(); }
  else if(m.type==='kof_cluster'){ kofCl=m.cluster; drawKof(); }
}
function sync(){
  var s=appSt.status;
  document.getElementById('pill').className='pill '+s;
  document.getElementById('pilltxt').textContent=s[0].toUpperCase()+s.slice(1);
  document.getElementById('btn-run').disabled=s==='running';
  document.getElementById('btn-dry').disabled=s==='running';
  document.getElementById('btn-stp').disabled=s!=='running';
  upHdr(); renderChips();
}
function upHdr(){
  document.getElementById('h-topics').textContent =appSt.topics.length;
  document.getElementById('h-planned').textContent=appSt.stats.planned;
  document.getElementById('h-pub').textContent    =appSt.stats.published;
}
function startTmr(){ stopTmr(); elTmr=setInterval(function(){ var s=Math.floor((Date.now()-startTs)/1000); document.getElementById('h-el').textContent=Math.floor(s/60)+'m '+s%60+'s'; },1000); }
function stopTmr(){ if(elTmr){ clearInterval(elTmr); elTmr=null; } }
function encId(t){ return t.replace(/[^a-zA-Z0-9_-]/g,'_'); }
function renderChips(){ document.getElementById('chips').innerHTML=appSt.topics.map(function(t){ return '<span class="chip" id="chip-'+encId(t)+'">'+t+'</span>'; }).join(''); }
function flowAnim(t){ var c=document.getElementById('chip-'+encId(t)); if(c){ c.classList.add('lit'); setTimeout(function(){ c.classList.remove('lit'); },600); } spawnP(t); }
function log(type,line){ var d=document.createElement('div'); d.className={o:'lo',e:'le',s:'ls',b:'lb'}[type]||'lo'; d.textContent='['+new Date().toTimeString().slice(0,8)+'] '+line; var t=document.getElementById('term'); t.appendChild(d); t.scrollTop=t.scrollHeight; }
document.getElementById('btn-clr').onclick=function(){ document.getElementById('term').innerHTML=''; };
function buildArgs(dry){
  var a=[],v=function(id){ return document.getElementById(id).value.trim(); };
  if(v('f-cfg')) a.push('--config',v('f-cfg'));
  if(v('f-src')) a.push('--source-bootstrap',v('f-src'));
  if(v('f-tgt')) a.push('--target-bootstrap',v('f-tgt'));
  var tp=v('f-tp'); if(tp&&tp!=='.*') a.push('--topic-pattern',tp);
  if(v('f-rf'))  a.push('--replication-factor',v('f-rf'));
  if(v('f-cid')) a.push('--client-id',v('f-cid'));
  if(v('f-to'))  a.push('--request-timeout-ms',v('f-to'));
  if(v('f-mp'))  a.push('--max-empty-polls',v('f-mp'));
  if(document.getElementById('f-int').checked) a.push('--include-internal','true');
  if(dry||document.getElementById('f-dry').checked) a.push('--dry-run');
  return a;
}
function upPreview(){ document.getElementById('cmdprev').textContent='run-kafka-to-kof.sh '+buildArgs(false).join(' '); }
document.querySelectorAll('#botrow input').forEach(function(el){ el.addEventListener('input',upPreview); });
upPreview();
async function doRun(dry){
  var cp=document.getElementById('f-cp').value.trim();
  if(!cp){ log('b','ERROR: KAFKA_CLASSPATH is required'); return; }
  appSt.topics=[]; appSt.stats={planned:0,published:0}; renderChips(); upHdr(); dbFill=0; dbTarget=0;
  var a=buildArgs(dry);
  log('s','Starting: run-kafka-to-kof.sh '+a.join(' '));
  var r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({args:a,kafkaClasspath:cp})});
  var j=await r.json(); if(j.error) log('b','Error: '+j.error);
}
document.getElementById('btn-run').onclick=function(){ doRun(false); };
document.getElementById('btn-dry').onclick=function(){ doRun(true); };
document.getElementById('btn-stp').onclick=function(){ fetch('/api/stop',{method:'POST'}); };

// Kafka Stats modal
async function getKafkaStats(){
  document.getElementById('stats-modal').classList.add('open');
  document.getElementById('stats-content').innerHTML='<p style="color:#8b949e;font-size:12px;">Connecting...</p>';
  try{
    var src=document.getElementById('f-src').value.trim();
    var r=await fetch('/api/kafka-stats'+(src?'?bootstrap='+encodeURIComponent(src):''));
    var data=await r.json(); kafkaCl=data; renderStats(data); drawKafka();
  }catch(e){ document.getElementById('stats-content').innerHTML='<p style="color:#ef4444;">Error: '+e.message+'</p>'; }
}
function renderStats(data){
  var online=(data.brokers||[]).filter(function(b){ return b.status==='online'; }).length;
  var tMsgs=(data.topics||[]).reduce(function(s,t){ return s+t.messages; },0);
  var html='<div class="strow">'
    +'<div class="stcard"><div class="stcard-l">Online</div><div class="stcard-v" style="color:#22c55e">'+online+'/3</div></div>'
    +'<div class="stcard"><div class="stcard-l">Topics</div><div class="stcard-v" style="color:#f97316">'+(data.topics||[]).length+'</div></div>'
    +'<div class="stcard"><div class="stcard-l">Messages</div><div class="stcard-v">'+tMsgs.toLocaleString()+'</div></div>'
    +'<div class="stcard" style="flex:2"><div class="stcard-l">Cluster ID</div><div class="stcard-v" style="font-size:10px;word-break:break-all">'+(data.clusterId||'--')+'</div></div></div>'
    +'<div style="margin-bottom:8px;font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase">Brokers</div>';
  (data.brokers||[]).forEach(function(b){
    html+='<div class="broker-row"><div class="bst '+b.status+'"></div><div class="binfo"><b>Broker-'+b.id+' ('+b.host+':'+b.port+')</b><br><small>'+b.status+'</small></div></div>';
  });
  if((data.topics||[]).length){
    html+='<div style="margin:10px 0 6px;font-size:10px;font-weight:700;color:#8b949e;text-transform:uppercase">Topics</div>';
    data.topics.forEach(function(t){ html+='<span class="topic-chip">'+t.name+' (p:'+t.partitions+' msgs:'+t.messages.toLocaleString()+')</span>'; });
  }
  document.getElementById('stats-content').innerHTML=html;
}
function closeStats(){ document.getElementById('stats-modal').classList.remove('open'); }
document.getElementById('stats-modal').addEventListener('click',function(e){ if(e.target===this) closeStats(); });

/*
   SVG CLUSTER DRAW
*/
function drawSvgCluster(svgEl, color, nodes, label){
  var W = parseInt(svgEl.getAttribute('width')  || 265);
  var H = parseInt(svgEl.getAttribute('height') || 320);
  svgEl.setAttribute('viewBox','0 0 '+W+' '+H);
  var ns='http://www.w3.org/2000/svg';
  while(svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

  var cx=W/2, cy=H*0.43, R=Math.min(W,H)*0.28;
  function mk(tag,a){ var e=document.createElementNS(ns,tag); for(var k in a) e.setAttribute(k,a[k]); return e; }
  function tx(x,y,s,a){ var e=mk('text',Object.assign({x:x,y:y,'text-anchor':'middle','font-family':'Segoe UI,sans-serif'},a)); e.textContent=s; return e; }

  svgEl.appendChild(mk('circle',{cx:cx,cy:cy,r:R+20,fill:'none',stroke:color,'stroke-width':'1','stroke-opacity':'.15','stroke-dasharray':'6 4'}));
  svgEl.appendChild(mk('circle',{cx:cx,cy:cy,r:'9',fill:color,'fill-opacity':'.22',stroke:color,'stroke-width':'1.5','stroke-opacity':'.55'}));

  var pts=nodes.map(function(_,i){
    var a=(i/nodes.length)*2*Math.PI-Math.PI/2;
    return {x:cx+R*Math.cos(a), y:cy+R*Math.sin(a)};
  });

  for(var i=0;i<pts.length;i++) for(var j=i+1;j<pts.length;j++)
    svgEl.appendChild(mk('line',{x1:pts[i].x,y1:pts[i].y,x2:pts[j].x,y2:pts[j].y,stroke:color,'stroke-width':'1.8','stroke-opacity':'.22','stroke-dasharray':'5 3'}));

  pts.forEach(function(p){ svgEl.appendChild(mk('line',{x1:cx,y1:cy,x2:p.x,y2:p.y,stroke:color,'stroke-width':'.8','stroke-opacity':'.12'})); });

  pts.forEach(function(p,i){
    var nd=nodes[i];
    var sc=nd.status==='online'?'#22c55e':nd.status==='offline'?'#ef4444':'#6b7280';
    var nr=R*0.36, bw=nr*1.1, bx=p.x-bw/2;
    svgEl.appendChild(mk('circle',{cx:p.x,cy:p.y,r:nr+14,fill:color,'fill-opacity':'.04'}));
    svgEl.appendChild(mk('circle',{cx:p.x,cy:p.y,r:nr+7, fill:'none',stroke:sc,'stroke-width':'2','stroke-opacity':'.5'}));
    svgEl.appendChild(mk('circle',{cx:p.x,cy:p.y,r:nr,   fill:'none',stroke:color,'stroke-width':'2.5','stroke-opacity':'.8'}));
    svgEl.appendChild(mk('circle',{cx:p.x,cy:p.y,r:nr-5, fill:color,'fill-opacity':'.15'}));
    [-5,0,5].forEach(function(dy){
      svgEl.appendChild(mk('rect',{x:bx,y:p.y+dy-2.2,width:bw,height:'4.4',rx:'1.4',fill:color,'fill-opacity':'.88'}));
      svgEl.appendChild(mk('circle',{cx:bx+bw-5,cy:p.y+dy,r:'2',fill:sc}));
    });
    var fs=Math.max(12,R*0.14);
    svgEl.appendChild(tx(p.x,p.y+nr+fs+4,   nd.name,             {'font-size':fs,      'font-weight':'800',fill:color}));
    svgEl.appendChild(tx(p.x,p.y+nr+fs*2+4, ':'+nd.port,         {'font-size':fs*0.82, 'font-weight':'500',fill:color,'fill-opacity':'.6'}));
    if(nd.status!=='unknown')
      svgEl.appendChild(tx(p.x,p.y+nr+fs*3+2,nd.status.toUpperCase(),{'font-size':fs*0.72,'font-weight':'700',fill:sc}));
  });
  svgEl.appendChild(tx(cx,H-8,label,{'font-size':'11','font-weight':'700',fill:color,'fill-opacity':'.4'}));
}

function drawKafka(){
  // Default ports: 9092, 9093, 9094 (demo KRaft cluster)
  var nodes=kafkaCl

    :[{name:'SRV-1',port:5635,status:'unknown'},{name:'SRV-2',port:5620,status:'unknown'},{name:'SRV-3',port:5623,status:'unknown'}];

/*
   DB CYLINDER
*/
function drawDbCylinder(){
  var cv=document.getElementById('dbcv');
  var W=cv.width||SIDE, H=cv.height||dbH||120;
  var c=cv.getContext('2d');
  c.clearRect(0,0,W,H);
  var cw=Math.min(W*0.52,88), ch=Math.min(H*0.65,88);
  var cx=W/2, cy=H/2, x=cx-cw/2, y=cy-ch/2, ry=cw*0.2;
  if(dbFill<dbTarget) dbFill=Math.min(dbFill+0.003,dbTarget);
  function cylPath(){ c.beginPath(); c.moveTo(x,y+ry); c.lineTo(x,y+ch-ry); c.bezierCurveTo(x,y+ch+ry,x+cw,y+ch+ry,x+cw,y+ch-ry); c.lineTo(x+cw,y+ry); c.bezierCurveTo(x+cw,y-ry,x,y-ry,x,y+ry); }
  var bg=c.createLinearGradient(x,0,x+cw,0);
  bg.addColorStop(0,'rgba(30,50,90,.9)'); bg.addColorStop(.4,'rgba(15,30,60,.95)'); bg.addColorStop(1,'rgba(40,65,110,.9)');
  cylPath(); c.fillStyle=bg; c.fill();
  if(dbFill>0.005){
    var fH=ch*dbFill, fY=y+ch-fH;
    c.save(); cylPath(); c.clip();
    var fg=c.createLinearGradient(0,fY,0,y+ch); fg.addColorStop(0,'rgba(59,130,246,.5)'); fg.addColorStop(.5,'rgba(37,99,235,.78)'); fg.addColorStop(1,'rgba(29,78,216,.92)');
    c.fillStyle=fg; c.fillRect(x,fY,cw,fH); c.restore();
  }
  cylPath(); c.strokeStyle='rgba(59,130,246,.7)'; c.lineWidth=1.5; c.stroke();
  c.beginPath(); c.ellipse(cx,y,cw/2,ry,0,0,Math.PI*2); c.strokeStyle='rgba(59,130,246,.95)'; c.lineWidth=2; c.stroke();
  for(var si=1;si<=4;si++){ var sy=y+ch*(si/5); c.beginPath(); c.moveTo(x+4,sy); c.lineTo(x+cw-4,sy); c.strokeStyle='rgba(255,255,255,.06)'; c.lineWidth=1; c.stroke(); }
  c.font='bold 14px Segoe UI,sans-serif'; c.fillStyle='#93c5fd'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(Math.round(dbFill*100)+'%',cx,cy);
  c.font='bold 8px Segoe UI,sans-serif'; c.fillStyle='#60a5fa'; c.fillText(appSt.stats.published.toLocaleString()+' msgs',cx,y-ry-6);
  c.fillStyle='#4b5563'; c.fillText('KOF DATA STORE',cx,y+ch+ry+10);
}

/*
   CONDUIT ANIMATION
*/
var cvEl=document.getElementById('cv');
var ctx=cvEl.getContext('2d');
var streams=[],topicColors={},cidx=0;
var COLORS=['#f97316','#3b82f6','#22c55e','#a855f7','#eab308','#06b6d4','#ec4899','#84cc16'];
function getColor(t){ if(!topicColors[t]) topicColors[t]=COLORS[cidx++%COLORS.length]; return topicColors[t]; }
function getStream(t){ var s=streams.find(function(s){ return s.topic===t; }); if(!s){ s={topic:t,color:getColor(t),particles:[]}; streams.push(s); } return s; }
function spawnP(t){ var s=getStream(t); for(var i=0;i<Math.ceil(Math.random()*4);i++) s.particles.push({p:Math.random()*.05,sp:.0022+Math.random()*.003}); }

function frame(){
  var W=cvEl.width, H=cvEl.height;
  if(!W||!H){ requestAnimationFrame(frame); return; }
  ctx.clearRect(0,0,W,H);
  var total=Math.max(streams.length,3);
  var pX=36,pW=W-72,pCY=H*0.44,pH=Math.min(H*0.52,200),pY=pCY-pH/2,capR=pH/2;

  var bg=ctx.createLinearGradient(0,pY,0,pY+pH);
  bg.addColorStop(0,'rgba(55,90,150,.98)'); bg.addColorStop(.08,'rgba(65,105,170,.93)');
  bg.addColorStop(.22,'rgba(20,42,85,.97)'); bg.addColorStop(.5,'rgba(6,12,30,.99)');
  bg.addColorStop(.78,'rgba(20,42,85,.97)'); bg.addColorStop(.92,'rgba(65,105,170,.93)'); bg.addColorStop(1,'rgba(55,90,150,.98)');
  ctx.fillStyle=bg; ctx.fillRect(pX,pY,pW,pH);

  var hi=ctx.createLinearGradient(0,pY,0,pY+pH*.15); hi.addColorStop(0,'rgba(160,205,255,.3)'); hi.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hi; ctx.fillRect(pX,pY,pW,pH*.15);
  var sh=ctx.createLinearGradient(0,pY+pH*.85,0,pY+pH); sh.addColorStop(0,'rgba(0,0,0,0)'); sh.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=sh; ctx.fillRect(pX,pY+pH*.85,pW,pH*.15);

  function edgeG(c){ var g=ctx.createLinearGradient(pX,0,pX+pW,0); g.addColorStop(0,c+'15'); g.addColorStop(.3,c+'cc'); g.addColorStop(.7,c+'cc'); g.addColorStop(1,c+'15'); return g; }
  ctx.strokeStyle=edgeG('#f97316'); ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(pX,pY); ctx.lineTo(pX+pW,pY); ctx.stroke();
  ctx.strokeStyle=edgeG('#3b82f6'); ctx.lineWidth=2.5; ctx.beginPath(); ctx.moveTo(pX,pY+pH); ctx.lineTo(pX+pW,pY+pH); ctx.stroke();

  ctx.save(); ctx.beginPath(); ctx.ellipse(pX,pCY,16,capR,0,0,Math.PI*2);
  var lc=ctx.createRadialGradient(pX-4,pCY-capR*.3,2,pX,pCY,16); lc.addColorStop(0,'rgba(249,115,22,.65)'); lc.addColorStop(.6,'rgba(249,115,22,.2)'); lc.addColorStop(1,'rgba(249,115,22,.02)');
  ctx.fillStyle=lc; ctx.fill(); ctx.strokeStyle='#f9731688'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();

  ctx.save(); ctx.beginPath(); ctx.ellipse(pX+pW,pCY,16,capR,0,0,Math.PI*2);
  var rc=ctx.createRadialGradient(pX+pW+4,pCY-capR*.3,2,pX+pW,pCY,16); rc.addColorStop(0,'rgba(59,130,246,.65)'); rc.addColorStop(.6,'rgba(59,130,246,.2)'); rc.addColorStop(1,'rgba(59,130,246,.02)');
  ctx.fillStyle=rc; ctx.fill(); ctx.strokeStyle='#3b82f688'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();

  for(var ri=1;ri<=7;ri++){ ctx.beginPath(); ctx.moveTo(pX+ri*(pW/8),pY+4); ctx.lineTo(pX+ri*(pW/8),pY+pH-4); ctx.strokeStyle='rgba(255,255,255,.04)'; ctx.lineWidth=1.5; ctx.stroke(); }

  var laneH=pH/total;
  for(var li=1;li<total;li++){ ctx.beginPath(); ctx.moveTo(pX+22,pY+li*laneH); ctx.lineTo(pX+pW-22,pY+li*laneH); ctx.strokeStyle='rgba(255,255,255,.07)'; ctx.lineWidth=1; ctx.stroke(); }

  var running = appSt && appSt.status === 'running';
  if (!running) { streams.forEach(function(s){ s.particles=[]; }); }
  streams.forEach(function(st,si){
    var lane=si%total, lcY=pY+lane*laneH+laneH/2;
    ctx.font='bold 10px sans-serif'; ctx.fillStyle=st.color+'99'; ctx.textAlign='left'; ctx.textBaseline='middle';
    ctx.fillText(st.topic.length>15?st.topic.slice(0,14)+'..':st.topic,pX+24,lcY);
    st.particles=st.particles.filter(function(p){ return p.p<=1; });
    st.particles.forEach(function(p){
      p.p+=p.sp; var px=pX+22+p.p*(pW-44);
      var tr=ctx.createLinearGradient(px-65,lcY,px,lcY); tr.addColorStop(0,st.color+'00'); tr.addColorStop(.6,st.color+'33'); tr.addColorStop(1,st.color+'cc');
      ctx.beginPath(); ctx.moveTo(px-65,lcY); ctx.lineTo(px,lcY); ctx.strokeStyle=tr; ctx.lineWidth=3; ctx.stroke();
      var og=ctx.createRadialGradient(px,lcY,0,px,lcY,10); og.addColorStop(0,st.color+'55'); og.addColorStop(1,st.color+'00');
      ctx.beginPath(); ctx.arc(px,lcY,10,0,Math.PI*2); ctx.fillStyle=og; ctx.fill();
      var cg=ctx.createRadialGradient(px,lcY,0,px,lcY,4); cg.addColorStop(0,'#fff'); cg.addColorStop(.5,st.color); cg.addColorStop(1,st.color+'66');
      ctx.beginPath(); ctx.arc(px,lcY,4,0,Math.PI*2); ctx.fillStyle=cg; ctx.fill();
    });
  });

  var lsg=ctx.createLinearGradient(0,0,pX,0); lsg.addColorStop(0,'rgba(249,115,22,.04)'); lsg.addColorStop(1,'rgba(249,115,22,.6)');
  ctx.strokeStyle=lsg; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(3,pCY); ctx.lineTo(pX,pCY); ctx.stroke();
  var rsg=ctx.createLinearGradient(pX+pW,0,W,0); rsg.addColorStop(0,'rgba(59,130,246,.6)'); rsg.addColorStop(1,'rgba(59,130,246,.04)');
  ctx.strokeStyle=rsg; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(pX+pW,pCY); ctx.lineTo(W-3,pCY); ctx.stroke();

  ctx.font='bold 11px sans-serif'; ctx.fillStyle='#374151'; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText('DATA  CONDUIT',W/2,pY-10);

  drawDbCylinder();
  requestAnimationFrame(frame);
}
