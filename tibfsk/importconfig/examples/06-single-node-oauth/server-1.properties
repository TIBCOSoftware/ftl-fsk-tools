############################# Server Basics #############################
#
# Single-node Kafka in KRaft mode — SASL_SSL OAUTHBEARER (OAuth 2.0 bearer token).
#
# FSK translation:
#   tibftlimportconfig \
#     --tls-cert /etc/ftl/certs/server.pem  --tls-key /etc/ftl/certs/server.key \
#     --oauth-token-url https://auth.example.com/oauth/token \
#     --oauth-jwks-url file:/etc/ftl/oauth.json \
#     --oauth-client-id ftl-server  --oauth-client-secret env:OAUTH_CLIENT_SECRET \
#     --oauth-provider-trust /etc/ftl/certs/oauth-provider.pem \
#     --output-dir ./kof-output server-1.properties
#
# Generates:
#   tibftlserver_standalone.yaml         — 1 SRV + 1 PSRV
#   tibftlserver_standalone-secure.yaml  — auth mode: oauth2
#                              globals: auth.providers: oauth2, claim mappings, token endpoint
#                              per-server: oauth2.validation.key, oauth2.provider.trust.file,
#                                          oauth2.svr.client.id, oauth2.svr.client.secret
#                              tls.server.cert / tls.server.private.key
#   ftlserver.json               — kof.cluster.0, 1 pserver, realm_is_secure=true
#   kof.broker.properties
#
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093

############################# Socket Server Settings #############################

# OAUTH: client-facing SASL_SSL OAUTHBEARER. CONTROLLER: SSL-only internal.
listeners=OAUTH://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=OAUTH
advertised.listeners=OAUTH://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:SSL,OAUTH:SASL_SSL

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# TLS / SSL Settings #############################

ssl.keystore.type=JKS
ssl.keystore.location=/etc/kafka/certs/localhost.keystore.jks
ssl.keystore.password=keystorePassword123
ssl.key.password=keyPassword123
ssl.truststore.type=JKS
ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
ssl.truststore.password=truststorePassword123
ssl.protocol=TLSv1.3
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.endpoint.identification.algorithm=https

############################# OAUTH Listener — SASL_SSL OAUTHBEARER #############################

sasl.mechanism.inter.broker.protocol=OAUTHBEARER
listener.name.oauth.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.oauth.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.token.endpoint.uri="https://auth.example.com/oauth/token" oauth.client.id="kafka-single-1" oauth.client.secret="broker-client-secret";
listener.name.oauth.oauthbearer.sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
listener.name.oauth.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
listener.name.oauth.oauthbearer.connections.max.reauth.ms=3600000

############################# CONTROLLER Listener — SSL only (internal) #############################

listener.name.controller.ssl.keystore.location=/etc/kafka/certs/localhost.keystore.jks
listener.name.controller.ssl.keystore.password=keystorePassword123
listener.name.controller.ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
listener.name.controller.ssl.truststore.password=truststorePassword123

############################# Log Basics #############################

log.dirs=/var/tmp/kafka/data/broker-1
num.partitions=1
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

############################# Log Flush Policy #############################

#log.flush.interval.messages=10000
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
