############################# Server Basics #############################
#
# Single-node Kafka in KRaft mode — no authentication, no TLS — converted with
# the FTL schema daemon enabled. Same input as example 01; the only difference
# is the --tibschemad flag.
#
# FSK translation: tibftlimportconfig --tibschemad --output-dir ./kof-output server-1.properties
#
# Generates:
#   tibftlserver_standalone.yaml   — 1 realm server (SRV1) + 1 pserver (PSRV1),
#                      plus a schema1 persistence and a tibschemad entry with
#                      cluster.size: 1 — no extra server and no extra port
#   realm.json         — kof.cluster.0 with a single pserver (pserver1) in _setA
#   kof.broker.properties
#
# KRaft: this node is both broker and controller (single-node quorum).
process.roles=broker,controller
node.id=1

# Single-node controller quorum — just this node.
controller.quorum.bootstrap.servers=localhost:9093

############################# Socket Server Settings #############################

# CLIENT on 9092 for Kafka clients; CONTROLLER on 9093 for KRaft quorum.
# Use a distinct CLIENT name (not PLAINTEXT) so tibftlimportconfig preserves the
# client listener in kof.broker.properties. In FSK, inter-broker replication
# is FTL-native; there is no Kafka-level inter-broker listener to strip.
listeners=CLIENT://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=CLIENT
advertised.listeners=CLIENT://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:PLAINTEXT,CLIENT:PLAINTEXT

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Log Basics #############################

log.dirs=/var/kafka/data/broker-1
num.partitions=1
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

# Single-node: replication factor must be 1.
offsets.topic.replication.factor=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1

############################# Log Flush Policy #############################

#log.flush.interval.messages=10000
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
