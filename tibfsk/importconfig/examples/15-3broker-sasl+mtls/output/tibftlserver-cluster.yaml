# FSK Cluster Configuration
# Generated by tibftlimportconfig from: server-1.properties
#
# Start the cluster (one tibftlserver per server entry):
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV1
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV2
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV3

globals:
  core.servers:
    SRV1: kafka-sasl-mtls-1:5692
    SRV2: kafka-sasl-mtls-2:5693
    SRV3: kafka-sasl-mtls-3:5694
  auth.providers: file:/etc/ftl/users.txt

servers:
  SRV1:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV1.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV2.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver2
      data: /var/tmp/kof/data/pserver2
      kof.broker.properties: output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm:
      data: /var/tmp/kof/data
      initial.realm.config: output/realm.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV3.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver3
      data: /var/tmp/kof/data/pserver3
      kof.broker.properties: output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

