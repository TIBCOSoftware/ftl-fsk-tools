############################# Server Basics #############################
#
# Broker 1 of 3, Kafka in ZooKeeper mode — no authentication, no TLS.
# Requires Kafka 3.9 or earlier; Kafka 4.x removed ZooKeeper entirely.
#
# All three brokers share one ZooKeeper and differ only in broker.id, the
# listener port and log.dirs.
#
# ZooKeeper mode names this broker's identity broker.id, the key KRaft later
# renamed to node.id. FSK reads node.id only, so tibftlimportconfig renames it on
# the way through — see the "Node ID:" line at the top of the generated
# kof.broker.1.properties.
broker.id=1

############################# ZooKeeper #############################

# FSK has no ZooKeeper: the cluster membership and metadata that ZooKeeper holds
# for Kafka are FTL-native. These keys are routed to unsupported.properties.
zookeeper.connect=localhost:2181
zookeeper.connection.timeout.ms=18000

############################# Socket Server Settings #############################

# PLAINTEXT on 9092 is the only listener and also carries inter-broker traffic.
# There is no CONTROLLER listener in ZooKeeper mode — the controller is elected
# through ZooKeeper rather than a KRaft quorum. Because PLAINTEXT is the only
# client-facing listener, tibftlimportconfig keeps it despite
# inter.broker.listener.name naming it; stripping it would leave the pserver with
# nothing to bind.
listeners=PLAINTEXT://localhost:9092
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=PLAINTEXT:PLAINTEXT

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# Log Basics #############################

log.dirs=/var/tmp/kafka/data/broker-1
num.partitions=3
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

# Replication factor 3 with min.isr 2 is the standard 3-node setting:
# it tolerates one broker being down.
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

############################# Log Flush Policy #############################

#log.flush.interval.messages=10000
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
