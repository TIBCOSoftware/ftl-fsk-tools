# FSK Cluster Configuration
# Generated by tibftlimportconfig from: server-1.properties
#
# Start the cluster (one tibftlserver per server entry):
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV1
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV2
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV3

globals:
  core.servers:
    SRV1: localhost:5600
    SRV2: localhost:5601
    SRV3: localhost:5602
  dr: DRSRV1@dr-host-1:5800|DRSRV2@dr-host-2:5801|DRSRV3@dr-host-3:5802
  auto.init.primary.on.first.startup: true

servers:
  SRV1:
  - realm:
      label: PRIMARY_SERVER
      data: /var/tmp/kof/data/srv1
      initial.realm.config: output-dr/ftlserver.json
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV1.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: output-dr/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
  - realm:
      label: PRIMARY_SERVER
      data: /var/tmp/kof/data/srv2
      initial.realm.config: output-dr/ftlserver.json
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV2.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver2
      data: /var/tmp/kof/data/pserver2
      kof.broker.properties: output-dr/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV3:
  - realm:
      label: PRIMARY_SERVER
      data: /var/tmp/kof/data/srv3
      initial.realm.config: output-dr/ftlserver.json
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV3.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver3
      data: /var/tmp/kof/data/pserver3
      kof.broker.properties: output-dr/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

