# FSK Auxiliary Cluster Configuration (group 3)
# Generated by tibftlimportconfig from: server-1.properties
#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver -c tibftlserver-cluster-aux2.yaml -n PSRV7

globals:
  core.servers:
    SRV1: localhost:5601
    SRV2: localhost:5602
    SRV3: localhost:5603

servers:
  PSRV7:
  - ftl:
      server: localhost:5786
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/PSRV7.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver7
      data: /var/tmp/kof/data/pserver7
      kof.broker.properties: output/kof.broker.7.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV8:
  - ftl:
      server: localhost:5771
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/PSRV8.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver8
      data: /var/tmp/kof/data/pserver8
      kof.broker.properties: output/kof.broker.8.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV9:
  - ftl:
      server: localhost:5725
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/PSRV9.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver9
      data: /var/tmp/kof/data/pserver9
      kof.broker.properties: output/kof.broker.9.properties
      loglevel: connections:info;kof:info;durables:info;store:info

