# FSK Cluster Configuration
# Generated by tibftlimportconfig from: server-1.properties
#
# Start the cluster (one tibftlserver per server entry):
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV1
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV2
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV3
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV4
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV5
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV6
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV7
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV8
#   tibftlserver -c tibftlserver-cluster.yaml -n SRV9

globals:
  # Bootstrap addresses for the FTL backend: the first shard only. The
  # remaining servers carry their own address in an 'ftl:' block below.
  core.servers:
    SRV1: localhost:5601
    SRV2: localhost:5602
    SRV3: localhost:5603
  auth.providers: file:output/ftl-users.txt

servers:
  SRV1:
  - realm:
      data: /var/tmp/kof/data/srv1
      initial.realm.config: output/ftlserver.json
  - ftlserver.properties:
      user: internal
      password: internal-pw
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV1.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
