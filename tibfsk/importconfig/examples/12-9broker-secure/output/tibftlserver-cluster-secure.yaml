# FSK Cluster — Secure Configuration
# Generated by tibftlimportconfig from: server-1.properties
#
# Auth providers: file:output/ftl-users.txt,mtls,oauth2
#
# Start the cluster (one tibftlserver per server entry):
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV1
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV2
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV3
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV4
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV5
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV6
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV7
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV8
#   tibftlserver -c tibftlserver-cluster-secure.yaml -n SRV9

globals:
  # Bootstrap addresses for the FTL backend: the first shard only. The
  # remaining servers carry their own address in an 'ftl:' block below.
  core.servers:
    SRV1: localhost:5601
    SRV2: localhost:5602
    SRV3: localhost:5603
  auth.providers: file:output/ftl-users.txt,mtls,oauth2
  oauth2.claim.roles: group
  oauth2.claim.username: preferred_username
  oauth2.audience: ftl
  oauth2.ui.endpoint.auth: https://auth.example.com/oauth/authorize
  oauth2.ui.endpoint.token: https://auth.example.com/oauth/token
  oauth2.ui.endpoint.logout: https://auth.example.com/oauth/logout
  oauth2.svr.endpoint.token: https://auth.example.com/oauth/token

servers:
  SRV1:
  - realm:
      user: primary
      password: primary-pw
      data: /var/tmp/kof/data/srv1
      initial.realm.config: output/ftlserver.json
  - ftlserver.properties:
      tls.server.cert: /etc/ftl/certs/server.pem
      tls.server.trust.file: /etc/ftl/certs/client-ca.pem
      tls.client.cert: /etc/ftl/certs/client.pem
      tls.client.private.key: /etc/ftl/certs/client.key
      oauth2.validation.key: file:/etc/ftl/oauth.json
      oauth2.ui.client.id: ftl-ui
      oauth2.ui.client.secret: env:OAUTH_UI_CLIENT_SECRET
      oauth2.provider.trust.file: /etc/ftl/certs/oauth-provider.pem
      oauth2.svr.client.id: ftl-server
      oauth2.svr.client.secret: env:OAUTH_CLIENT_SECRET
      loglevel: info
      #logfile: /var/tmp/kof/data/SRV1.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  SRV2:
