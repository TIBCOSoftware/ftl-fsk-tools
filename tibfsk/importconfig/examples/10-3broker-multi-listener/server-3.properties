############################# Server Basics #############################

process.roles=broker,controller
node.id=3
controller.quorum.bootstrap.servers=localhost:9093,localhost:9103,localhost:9113

############################# Socket Server Settings #############################

listeners=BASIC_AUTH://localhost:9112,OAUTH://localhost:9114,MTLS://localhost:9115,CONTROLLER://localhost:9113
inter.broker.listener.name=BASIC_AUTH
advertised.listeners=BASIC_AUTH://localhost:9112,OAUTH://localhost:9114,MTLS://localhost:9115,CONTROLLER://localhost:9113
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:SSL,BASIC_AUTH:SASL_SSL,OAUTH:SASL_SSL,MTLS:SSL
num.network.threads=4
num.io.threads=10
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# TLS / SSL Base Settings #############################

ssl.keystore.type=JKS
ssl.keystore.location=/etc/kafka/certs/broker-3.keystore.jks
ssl.keystore.password=keystorePassword123
ssl.key.password=keyPassword123
ssl.truststore.type=JKS
ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
ssl.truststore.password=truststorePassword123
ssl.protocol=TLSv1.3
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.endpoint.identification.algorithm=https

############################# BASIC_AUTH Listener — SASL_SSL PLAIN #############################

listener.name.basic_auth.sasl.enabled.mechanisms=PLAIN
listener.name.basic_auth.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret" user_admin="admin-secret" user_producer="producer-secret" user_consumer="consumer-secret";
sasl.mechanism.inter.broker.protocol=PLAIN

############################# OAUTH Listener — SASL_SSL OAUTHBEARER #############################

listener.name.oauth.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.oauth.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.token.endpoint.uri="https://auth.example.com/oauth/token" oauth.client.id="kafka-broker-3" oauth.client.secret="broker-client-secret";
listener.name.oauth.oauthbearer.sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
listener.name.oauth.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
listener.name.oauth.oauthbearer.connections.max.reauth.ms=3600000

############################# MTLS Listener #############################

listener.name.mtls.ssl.client.auth=required
listener.name.mtls.ssl.keystore.location=/etc/kafka/certs/broker-3.keystore.jks
listener.name.mtls.ssl.keystore.password=keystorePassword123
listener.name.mtls.ssl.truststore.location=/etc/kafka/certs/kafka.ca.truststore.jks
listener.name.mtls.ssl.truststore.password=truststorePassword123

############################# CONTROLLER Listener #############################

listener.name.controller.ssl.keystore.location=/etc/kafka/certs/broker-3.keystore.jks
listener.name.controller.ssl.keystore.password=keystorePassword123
listener.name.controller.ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
listener.name.controller.ssl.truststore.password=truststorePassword123

############################# Log Basics #############################

log.dirs=/var/tmp/kafka/data/broker-3
num.partitions=3
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

offsets.topic.replication.factor=3
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

############################# Log Retention Policy #############################

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
