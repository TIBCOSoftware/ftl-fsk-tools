# FSK Cluster Configuration
# Generated by tibftlimportconfig from: server-1.properties
#
# Start the cluster (one tibftlserver per server entry):
#   tibftlserver -c tibftlserver-cluster.yaml -n primary1
#   tibftlserver -c tibftlserver-cluster.yaml -n primary2
#   tibftlserver -c tibftlserver-cluster.yaml -n primary3

globals:
  core.servers:
    primary1: primary-host-1:8585
    primary2: primary-host-2:8686
    primary3: primary-host-3:8787
  dr: drserver1@localhost:9585|drserver2@localhost:9686|drserver3@localhost:9787
  auto.init.primary.on.first.startup: true

servers:
  primary1:
  - realm:
      label: PRIMARY_SERVER
      data: /var/tmp/kof/data/srv1
      initial.realm.config: output/ftlserver.json
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/primary1.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver1
      data: /var/tmp/kof/data/pserver1
      kof.broker.properties: output/kof.broker.1.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  primary2:
  - realm:
      label: PRIMARY_SERVER
      data: /var/tmp/kof/data/srv2
      initial.realm.config: output/ftlserver.json
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/primary2.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver2
      data: /var/tmp/kof/data/pserver2
      kof.broker.properties: output/kof.broker.2.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  primary3:
  - realm:
      label: PRIMARY_SERVER
      data: /var/tmp/kof/data/srv3
      initial.realm.config: output/ftlserver.json
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/primary3.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver3
      data: /var/tmp/kof/data/pserver3
      kof.broker.properties: output/kof.broker.3.properties
      loglevel: connections:info;kof:info;durables:info;store:info

