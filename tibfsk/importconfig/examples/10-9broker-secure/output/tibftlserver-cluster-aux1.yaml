# FSK Auxiliary Cluster Configuration (group 2)
# Generated by tibftlimportconfig from: server-1.properties
#
# Pservers in this file connect to the primary realm cluster.
# Start: tibftlserver -c tibftlserver-cluster-aux1.yaml -n PSRV4

globals:
  core.servers:
    SRV1: localhost:5601
    SRV2: localhost:5602
    SRV3: localhost:5603

servers:
  PSRV4:
  - ftl:
      server: localhost:5724
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/PSRV4.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver4
      data: /var/tmp/kof/data/pserver4
      kof.broker.properties: output/kof.broker.4.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV5:
  - ftl:
      server: localhost:5763
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/PSRV5.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver5
      data: /var/tmp/kof/data/pserver5
      kof.broker.properties: output/kof.broker.5.properties
      loglevel: connections:info;kof:info;durables:info;store:info

  PSRV6:
  - ftl:
      server: localhost:5751
  - ftlserver.properties:
      loglevel: info
      #logfile: /var/tmp/kof/data/PSRV6.log
      #max.log.size: 10240000
      #max.logs: 10
  - persistence:
      name: pserver6
      data: /var/tmp/kof/data/pserver6
      kof.broker.properties: output/kof.broker.6.properties
      loglevel: connections:info;kof:info;durables:info;store:info

