############################# Server Basics #############################
#
# 3-broker Kafka cluster in KRaft mode — TLS encryption only (no SASL, no mutual TLS).
# All nodes form the controller quorum.
#
# Use this pattern when you want wire encryption but handle authorization
# at the application layer (e.g., Kafka ACLs, network policies).
#
# FSK translation (run once; all 3 brokers share the same FTL cluster):
#   tibftlimportconfig \
#     --tls-cert /etc/ftl/certs/server.pem  --tls-key /etc/ftl/certs/server.key \
#     --tls-ca /etc/ftl/certs/ca.pem \
#     --output-dir ./kof-output server-1.properties
#
# Generates:
#   tibftlserver-cluster.yaml         — SRV1–3 + PSRV1–3
#   tibftlserver-cluster-secure.yaml  — auth mode: tls-only
#                              user: internal / password: internal-pw
#                              tls.server.cert / tls.server.private.key / tls.client.trust.file
#   ftlserver.json               — kof.cluster.0, 3 pservers, realm_is_secure=true
#   kof.broker.properties
#
process.roles=broker,controller
node.id=1
controller.quorum.bootstrap.servers=localhost:9093,localhost:9103,localhost:9113

############################# Socket Server Settings #############################

# SSL: client-facing TLS encryption (no auth). CONTROLLER: SSL internal quorum.
listeners=SSL://localhost:9092,CONTROLLER://localhost:9093
inter.broker.listener.name=SSL
advertised.listeners=SSL://localhost:9092
controller.listener.names=CONTROLLER
listener.security.protocol.map=CONTROLLER:SSL,SSL:SSL

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

############################# TLS / SSL Settings #############################

ssl.keystore.type=JKS
ssl.keystore.location=/etc/kafka/certs/broker-1.keystore.jks
ssl.keystore.password=keystorePassword123
ssl.key.password=keyPassword123
ssl.truststore.type=JKS
ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
ssl.truststore.password=truststorePassword123
ssl.protocol=TLSv1.3
ssl.enabled.protocols=TLSv1.3,TLSv1.2
ssl.endpoint.identification.algorithm=https

# No client certificate required — server authenticates to clients, not vice versa.
ssl.client.auth=none

############################# CONTROLLER Listener — SSL only (internal) #############################

listener.name.controller.ssl.keystore.location=/etc/kafka/certs/broker-1.keystore.jks
listener.name.controller.ssl.keystore.password=keystorePassword123
listener.name.controller.ssl.truststore.location=/etc/kafka/certs/kafka.truststore.jks
listener.name.controller.ssl.truststore.password=truststorePassword123

############################# Log Basics #############################

log.dirs=/var/tmp/kafka/data/broker-1
num.partitions=3
num.recovery.threads.per.data.dir=1

############################# Internal Topic Settings #############################

offsets.topic.replication.factor=3
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

############################# Log Flush Policy #############################

#log.flush.interval.messages=10000
#log.flush.interval.ms=1000

############################# Log Retention Policy #############################

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
