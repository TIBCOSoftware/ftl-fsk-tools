# Kafka ZooKeeper mode — broker 1 of 3
#
# Requires Kafka 3.9 or earlier. Kafka 4.x removed ZooKeeper support entirely,
# so this file will not start under a 4.x installation.
#
#   bash kafka-examples/start-kafka-zk.sh three-node
#
# Bootstrap servers: localhost:9092,localhost:9093,localhost:9094
#
# Brokers 2 and 3 are identical to this file except for broker.id, the
# listener port, and log.dirs. All three share one ZooKeeper.

broker.id=1

listeners=PLAINTEXT://localhost:9092
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=PLAINTEXT:PLAINTEXT

zookeeper.connect=localhost:2181
zookeeper.connection.timeout.ms=18000

log.dirs=/tmp/kafka-examples-zk/broker-1

# Topic defaults. Replication factor 3 with min.insync.replicas 2 is the
# standard 3-node setting: it tolerates one broker being down.
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2

log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
