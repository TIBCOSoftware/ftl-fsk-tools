# Kafka 4.x KRaft — single-node cluster (no ZooKeeper)
#
# One process acting as both broker and controller. This is the smallest source
# cluster you can migrate from, and the quickest way to try tibftlimportconfig.
#
#   bash kafka-examples/start-kafka.sh single-node
#
# Bootstrap server: localhost:9092

process.roles=broker,controller
node.id=1

# Controller quorum — a single voter, this node itself.
# kafka-storage.sh format requires a static voter list.
controller.quorum.voters=1@localhost:9911
controller.listener.names=CONTROLLER

# Listeners.
# PLAINTEXT is the only client-facing listener and also carries inter-broker
# traffic. CONTROLLER is KRaft-internal; tibftlimportconfig filters it out of the
# generated FSK config, because in FSK the quorum is FTL-native.
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9911
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

# Data storage
log.dirs=/tmp/kafka-examples/single-node

# Topic defaults. Everything is 1 because there is only one broker —
# a replication factor above 1 would leave topics permanently under-replicated.
num.partitions=3
default.replication.factor=1
min.insync.replicas=1
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# Log retention
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Socket / thread settings
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
