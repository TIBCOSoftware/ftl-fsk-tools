# Kafka 4.x KRaft — broker 1 of 3 (no ZooKeeper)
#
# Three processes, each acting as both broker and controller, all on localhost.
# This mirrors the shape of a real 3-node cluster and maps 1:1 onto a 3-pserver
# FSK cluster.
#
#   bash kafka-examples/start-kafka.sh three-node
#
# Bootstrap servers: localhost:9092,localhost:9093,localhost:9094
#
# Brokers 2 and 3 are identical to this file except for node.id, the two
# listener ports, and log.dirs.

process.roles=broker,controller
node.id=1

# Controller quorum — all three nodes vote. Identical in all three files.
# kafka-storage.sh format requires a static voter list.
controller.quorum.voters=1@localhost:9911,2@localhost:9912,3@localhost:9913
controller.listener.names=CONTROLLER

# Listeners.
# PLAINTEXT is the only client-facing listener and also carries inter-broker
# traffic. CONTROLLER is KRaft-internal; tibftlimportconfig filters it out of the
# generated FSK config, because in FSK the quorum is FTL-native.
listeners=PLAINTEXT://localhost:9092,CONTROLLER://localhost:9911
advertised.listeners=PLAINTEXT://localhost:9092
inter.broker.listener.name=PLAINTEXT
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

# Data storage — one directory per broker
log.dirs=/tmp/kafka-examples/broker-1

# Topic defaults. Replication factor 3 with min.insync.replicas 2 is the
# standard 3-node setting: it tolerates one broker being down.
num.partitions=3
default.replication.factor=3
min.insync.replicas=2
offsets.topic.replication.factor=3
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
share.coordinator.state.topic.replication.factor=3
share.coordinator.state.topic.min.isr=2

# Log retention
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# Socket / thread settings
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600
